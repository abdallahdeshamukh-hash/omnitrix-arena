<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Omnitrix Arena — Ben 10</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; overflow:hidden; background:#05070d; font-family:'Segoe UI', Arial, sans-serif; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; touch-action:none; }
</style>
</head>
<body>
<div id="wrap"><canvas id="game"></canvas></div>
<script>
"use strict";
/* ============================================================
   OMNITRIX ARENA — a Ben 10 fan game
   Survive waves of Vilgax's drones. Cycle the Omnitrix (Q or
   tap the dial), transform (E / big button), use each alien's
   power. Energy drains while transformed — revert to Ben to
   recharge. Fan project. Ben 10 (C) Cartoon Network.
   ============================================================ */

// ---------- Canvas ----------
const cv = document.getElementById('game');
const ctx = cv.getContext('2d');
let W = window.innerWidth, H = window.innerHeight, DPR = 1;
function resize(){
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth; H = window.innerHeight;
  cv.width = Math.floor(W * DPR); cv.height = Math.floor(H * DPR);
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', resize);
resize();

// ---------- Helpers ----------
const TAU = Math.PI*2;
const rand = (a,b)=>a+Math.random()*(b-a);
const clamp = (v,a,b)=>Math.max(a,Math.min(b,v));
const dist = (ax,ay,bx,by)=>Math.hypot(bx-ax, by-ay);
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

// ---------- Audio (tiny synth, all optional) ----------
let AC = null, muted = false;
let volume = 0.7;
try{ const v = parseFloat(localStorage.getItem('omnitrix_vol')); if(!isNaN(v)) volume = clamp(v,0,1); }catch(e){}
function audioInit(){ if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC = null; } } }
function tone(freq, dur, type, vol, slideTo){
  if(!AC || muted) return;
  try{
    const o = AC.createOscillator(), g = AC.createGain();
    o.type = type||'sine'; o.frequency.setValueAtTime(freq, AC.currentTime);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo), AC.currentTime+dur);
    g.gain.setValueAtTime((vol||0.05)*volume, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, AC.currentTime+dur);
    o.connect(g); g.connect(AC.destination);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}
const sfx = {
  shoot: ()=>tone(520, .08, 'square', .022, 260),
  shard: ()=>tone(760, .07, 'triangle', .03, 420),
  smash: ()=>tone(120, .25, 'sawtooth', .06, 45),
  dash:  ()=>tone(300, .18, 'sine', .05, 900),
  soul:  ()=>tone(220, .3, 'sine', .05, 90),
  spark: ()=>tone(880, .05, 'square', .015, 700),
  hit:   ()=>tone(200, .12, 'sawtooth', .05, 80),
  explode:()=>tone(90, .35, 'sawtooth', .07, 35),
  hurt:  ()=>tone(140, .2, 'square', .06, 60),
  pickup:()=>tone(660, .12, 'sine', .05, 990),
  transform:()=>{ tone(330,.35,'sawtooth',.06,660); setTimeout(()=>tone(660,.3,'sawtooth',.05,990),120); },
  revert:()=>tone(660,.3,'sine',.05,220),
  wave:  ()=>{ tone(440,.15,'square',.04); setTimeout(()=>tone(660,.2,'square',.04),150); },
  // boss
  bossRoar: ()=>{ tone(70,.7,'sawtooth',.10,40); setTimeout(()=>tone(52,.6,'sawtooth',.09,30),180); },
  bossLaser: ()=>{ tone(240,.14,'sawtooth',.05,120); },
  bossSlam: ()=>{ tone(55,.4,'sawtooth',.11,25); setTimeout(()=>tone(90,.2,'square',.05,50),80); },
  bossDefeat: ()=>{ tone(300,.9,'sawtooth',.09,40); setTimeout(()=>tone(160,.8,'square',.07,30),250); setTimeout(()=>tone(660,.5,'sine',.06,1320),500); },
};

// ---------- Game state ----------
const ST = { MENU:0, PLAY:1, OVER:2 };
let state = ST.MENU;

const world = { w:2000, h:1400 };
const cam = { x:0, y:0 };
const player = {
  x: world.w/2, y: world.h/2, r: 15,
  vx:0, vy:0,
  hp: 100, maxHp: 100,
  alien: 0, transformed: false,
  energy: 100, maxEnergy: 100,
  rechargeCd: 0, iFrames: 0,
  dashT: 0, dashDx:0, dashDy:0, dashHit: null,
  fireCd: 0, flameT: 0,
  faceX: 1, faceY: 0,
  moveX:0, moveY:0, aiming:false,
};
let bullets = [], ebullets = [], enemies = [], particles = [], pickups = [], floaters = [], shockwaves = [];
let spawnQueue = [], spawnT = 0;
let wave = 0, waveTimer = 2.5, betweenWaves = true;
let boss = null;   // Vilgax (every 5th wave)
let score = 0, kills = 0, best = 0;
try{ best = +(localStorage.getItem('omnitrix_best')||0); }catch(e){}

// ---------- Difficulty ----------
const DIFFS = {
  easy:   { label:'EASY',   hp:0.7,  spd:0.8,  dmg:0.65, count:0.7,  gap:1.5,  drain:0.7,  drop:1.6, break:5   },
  medium: { label:'MEDIUM', hp:0.85, spd:0.9,  dmg:0.8,  count:0.85, gap:1.25, drain:0.85, drop:1.25, break:4  },
  hard:   { label:'HARD',   hp:1,    spd:1,    dmg:1,    count:1,    gap:1,    drain:1,    drop:1,   break:3.5 },
};
let diffKey = 'medium';
try{ const s = localStorage.getItem('omnitrix_diff'); if(s && DIFFS[s]) diffKey = s; }catch(e){}
let DIFF = DIFFS[diffKey];
function setDifficulty(k){
  if(!DIFFS[k]) return;
  diffKey = k; DIFF = DIFFS[k];
  try{ localStorage.setItem('omnitrix_diff', k); }catch(e){}
  tone(600,.1,'sine',.04,900);
}
let menuBtns = [];
let menuSlider = null;
let paused = false;
function togglePause(){
  if(state!==ST.PLAY) return;
  paused = !paused;
  if(paused && selectUI.open) closeSelect();
  tone(paused?300:500,.1,'sine',.04,paused?200:700);
}
let shakeT = 0, shakeMag = 0, hitFlash = 0;
let dialAnim = 0, time = 0;
let selectUI = { open:false, idx:0, t:0, slide:0 };
let transformFX = null;
let heroTimeDone = false;
let energyBeepT = 0, dialGlow = 0;
let announce = null, announceT = 0;
function say(txt, sub, col){ announce = {txt, sub, col: col||'#7dfa4c'}; announceT = 2.2; }

// ---------- Aliens ----------
const ALIENS = [
  { name:'HEATBLAST', color:'#ff7b24', color2:'#ffd23f', speed:250, r:15, energyRate:7,
    desc:'Fireballs' },
  { name:'FOUR ARMS', color:'#e63946', color2:'#ffb4a2', speed:230, r:19, energyRate:6,
    desc:'Shockwave smash' },
  { name:'XLR8', color:'#37b6ff', color2:'#b8f2ff', speed:300, r:14, energyRate:9,
    desc:'Blitz dash' },
  { name:'DIAMONDHEAD', color:'#4be3a4', color2:'#e8fff5', speed:220, r:17, energyRate:5,
    desc:'Crystal shards' },
  { name:'GHOSTFREAK', color:'#c9c3f5', color2:'#f1edff', speed:260, r:15, energyRate:8,
    desc:'70% phase dodge + soul blast' },
  { name:'GREY MATTER', color:'#9bd45f', color2:'#eaf7d3', speed:320, r:9, energyRate:3,
    desc:'Rapid sparks' },
  // SECRET — never shown in any UI; transform with X
  { name:'ALIEN X', color:'#3d3d6b', color2:'#ffffff', speed:360, r:16, energyRate:0,
    desc:'???' },
];

function fire(){
  const p = player;
  if(p.fireCd > 0) return;
  const a = (p.faceX || p.faceY) ? Math.atan2(p.faceY, p.faceX) : 0;
  const al = p.alien;
  if(al === 0){ // HEATBLAST
    p.fireCd = 0.28;
    for(const s of [-0.09, 0, 0.09]) bullets.push(mkBullet(p.x,p.y,a+s,620,12,'fire','#ff9a3d','#ffe27a'));
    muzzle(p.x+Math.cos(a)*18, p.y+Math.sin(a)*18, '#ffb347'); sfx.shoot();
  } else if(al === 1){ // FOUR ARMS
    p.fireCd = 0.55;
    shockwaves.push({x:p.x,y:p.y,r:10,max:150,spd:520,dmg:26,hit:new Set(),color:'#ff6b6b'});
    shake(6,.25); sfx.smash();
    for(let i=0;i<14;i++) particles.push(mkParticle(p.x,p.y,rand(0,TAU),rand(80,260),'#ff8787',rand(.2,.45)));
  } else if(al === 2){ // XLR8
    p.fireCd = 0.3;
    p.dashT = 0.18; p.dashDx = Math.cos(a); p.dashDy = Math.sin(a); p.dashHit = new Set();
    sfx.dash();
    for(let i=0;i<10;i++) particles.push(mkParticle(p.x,p.y,a+Math.PI+rand(-.5,.5),rand(120,300),'#7ee3ff',rand(.15,.35)));
  } else if(al === 3){ // DIAMONDHEAD
    p.fireCd = 0.4;
    for(const s of [-0.22, 0, 0.22]) bullets.push(mkBullet(p.x,p.y,a+s,560,14,'shard','#7dffd1','#ffffff'));
    muzzle(p.x+Math.cos(a)*16, p.y+Math.sin(a)*16, '#7dffd1'); sfx.shard();
  } else if(al === 4){ // GHOSTFREAK
    p.fireCd = 0.5;
    bullets.push(mkBullet(p.x,p.y,a,420,18,'soul','#d7d2ff','#8f7bff'));
    muzzle(p.x+Math.cos(a)*14, p.y+Math.sin(a)*14, '#b9a8ff'); sfx.soul();
  } else if(al === 5){ // GREY MATTER
    p.fireCd = 0.24;
    bullets.push(mkBullet(p.x,p.y,a,700,5,'spark','#c6ff7a','#f4ffd9'));
    sfx.spark();
  } else if(al === 6){ // ALIEN X — cosmic barrage (god mode: fastest + hardest hitting)
    p.fireCd = 0.16;
    for(const s of [-0.18,0,0.18]) bullets.push(mkBullet(p.x,p.y,a+s,620,40,'cosmic','#ffffff','#c9b8ff'));
    muzzle(p.x+Math.cos(a)*18, p.y+Math.sin(a)*18, '#c9b8ff');
    tone(980,.12,'sine',.04,220); tone(180,.18,'sine',.035,70);
  }
}
function mkBullet(x,y,a,spd,dmg,kind,c1,c2){
  return { x,y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, r: kind==='soul'?9:(kind==='cosmic'?10:6), dmg, kind, c1, c2, life:1.6, pierce: kind==='soul'||kind==='cosmic', hitSet:new Set() };
}

// ---------- Enemies ----------
const ENEMY = {
  DNALIEN:  { r:16, hp:3,  spd:115, color:'#9db92c', color2:'#d7e86f', dmg:12, score:10 },
  XENOCITE: { r:10, hp:1,  spd:200, color:'#6f8f1f', color2:'#d9ff6b', dmg:8,  score:8  },
  SENTRY:   { r:15, hp:2,  spd:85,  color:'#5b6b8c', color2:'#9fb3d9', dmg:10, score:15 },
  WARBOT:   { r:28, hp:12, spd:58,  color:'#3d4660', color2:'#8fa0c0', dmg:18, score:30 },
  // BOSS — spawns via buildWave every 5th wave, drawn by its own branch
  VILGAX:   { r:64, hp:160, spd:62, color:'#31465a', color2:'#ff5964', dmg:22, score:2500 },
};
function spawnEnemy(type){
  if(type==='VILGAX'){
    const a = rand(0,TAU);   // materialize in view, ~320px from Ben
    boss = { type:'VILGAX', x: clamp(player.x + Math.cos(a)*320, 90, world.w-90), y: clamp(player.y + Math.sin(a)*320, 90, world.h-90), vx:0, vy:0, r:64, t:0, hitT:0,
      maxHp: Math.round(160*DIFF.hp*(1+(wave-5)*0.12)), spd: 62*DIFF.spd,
      fireCd: 2.2, slamCd: 3.5, burstCd: 5.5, summonCd: 9,
      slamT: 0, burstT: 0, burstN: 0, enraged: false };
    boss.hp = boss.maxHp;
    enemies.push(boss);   // he must live in the enemies list — update/draw/bullet loops all iterate it
    shake(14,.7);
    return;
  }
  const t = ENEMY[type];
  let x=0,y=0,tries=0;
  do{
    const side = Math.floor(rand(0,4));
    if(side===0){ x=rand(60,world.w-60); y=40; }
    else if(side===1){ x=world.w-40; y=rand(60,world.h-60); }
    else if(side===2){ x=rand(60,world.w-60); y=world.h-40; }
    else { x=40; y=rand(60,world.h-60); }
    tries++;
  } while(dist(x,y,player.x,player.y) < 350 && tries < 25);
  const hpScaled = Math.ceil(t.hp * (1 + Math.max(0, wave-3)*0.15) * DIFF.hp);
  enemies.push({
    type, x, y, vx:0, vy:0, r:t.r, dmg: Math.round(t.dmg*DIFF.dmg),
    hp: hpScaled, maxHp: hpScaled,
    spd: t.spd*rand(0.85,1.15)*DIFF.spd, fireCd: rand(1.5,3), t: rand(0,10), hitT: 0, phase: rand(0,TAU),
    lungeT:0, lungeCd: rand(1,2), lungeDx:0, lungeDy:0,
    chargeT:0, burstLeft:0, burstT:0, ax:0, ay:0,
  });
}
function buildWave(n){
  const q = [];
  if(n%5===0){                            // ===== BOSS WAVE — Vilgax =====
    q.push('VILGAX');    const m = Math.max(2, Math.round((2 + n*0.4) * DIFF.count));
    for(let i=0;i<m;i++) q.push(i%2 ? 'DNALIEN' : 'XENOCITE');
    return q;
  }
  if(n===1){ const c1 = Math.max(3, Math.round(5*DIFF.count)); for(let i=0;i<c1;i++) q.push('DNALIEN'); return q; }
  const count = Math.max(2, Math.round((3 + Math.floor(n*1.8)) * DIFF.count));
  const xenos = n>=2 ? Math.max(1, Math.round((2+n) * DIFF.count)) : 0;
  for(let i=0;i<xenos;i++) q.push('XENOCITE');
  for(let i=0;i<count;i++){
    const roll = Math.random();
    if(n>=4 && roll<0.16) q.push('WARBOT');
    else if(n>=2 && roll<0.48) q.push('SENTRY');
    else q.push('DNALIEN');
  }
  return q;
}

// ---------- FX ----------
function mkParticle(x,y,a,spd,color,life){
  return { x,y, vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, color, life, t:0, r:rand(2,4.5) };
}
function muzzle(x,y,color){ for(let i=0;i<5;i++) particles.push(mkParticle(x,y,rand(0,TAU),rand(40,140),color,rand(.1,.25))); }
function floater(x,y,txt,color){ floaters.push({x,y,txt,color,t:0}); }
function shake(mag,t){ shakeMag=Math.max(shakeMag,mag); shakeT=Math.max(shakeT,t); }
function burst(x,y,color,n,pow){
  for(let i=0;i<(n||16);i++) particles.push(mkParticle(x,y,rand(0,TAU),rand(60,pow||260),color,rand(.25,.6)));
}

// ---------- Input ----------
const keys = {};
window.addEventListener('keydown', e=>{
  const k = e.key.toLowerCase();
  keys[k] = true;
  if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k)) e.preventDefault();
  if(k==='m'){ muted = !muted; }
  if(state===ST.MENU || state===ST.OVER){
    if(k===' '||k==='enter') startGame();
    if(state===ST.MENU){
      if(k==='1') setDifficulty('easy');
      else if(k==='2') setDifficulty('medium');
      else if(k==='3') setDifficulty('hard');
      else if(k==='arrowleft'||k==='a') setDifficulty(['easy','medium','hard'][(['easy','medium','hard'].indexOf(diffKey)+2)%3]);
      else if(k==='arrowright'||k==='d') setDifficulty(['easy','medium','hard'][(['easy','medium','hard'].indexOf(diffKey)+1)%3]);
    }
    return;
  }
  if(state!==ST.PLAY) return;
  if(k==='p'||k==='escape'){ togglePause(); return; }
  if(k==='x' && !selectUI.open && !paused && !e.repeat){   // secret key
    if(player.transformed && player.alien===6) transformOff();
    else {
      player.alien = 6; dialAnim = 1;
      if(player.transformed) godSwap();          // mid-fight ascension into god mode
      else transformOn(true);                    // bypasses energy + recharge gates
    }
    return;
  }
  if(k==='tab'){ e.preventDefault(); selectUI.open ? closeSelect() : openSelect(); return; }
  if(k==='q'){ selectUI.open ? closeSelect() : openSelect(); return; }
  const num = parseInt(k,10);
  if(selectUI.open){
    if(num>=1 && num<=6){ selectUI.idx = num-1; tone(500,.06,'square',.03); }
    else if(k==='a'||k==='arrowleft') navSelect(-1);
    else if(k==='d'||k==='arrowright') navSelect(1);
    else if(k==='e'||k==='enter'||k===' ') confirmSelect();
    else if(k==='escape') closeSelect();
    return;
  }
  if(num>=1 && num<=6){ player.alien = num-1; dialAnim = 1; }
  if(k==='e' && !e.repeat){ player.transformed ? transformOff() : transformOn(); }
});
window.addEventListener('keyup', e=>{ keys[e.key.toLowerCase()] = false; });

let mouse = {x:W/2, y:H/2, down:false};
cv.addEventListener('mousemove', e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  if(state===ST.MENU && mouse.down && menuSlider && e.clientX>=menuSlider.x-14 && e.clientX<=menuSlider.x+menuSlider.w+14 && e.clientY>=menuSlider.y-16 && e.clientY<=menuSlider.y+menuSlider.h+16){
    volume = clamp(1-(e.clientY-menuSlider.y)/menuSlider.h, 0, 1);
    try{ localStorage.setItem('omnitrix_vol', String(volume)); }catch(err){}
  }
});
cv.addEventListener('mousedown', e=>{ if(e.button===0) mouse.down=true; });
window.addEventListener('mouseup', ()=>{ mouse.down=false; });
cv.addEventListener('contextmenu', e=>e.preventDefault());

// Mouse wheel: scroll through the Omnitrix dial, click to transform
let wheelAcc = 0;
cv.addEventListener('wheel', e=>{
  e.preventDefault();
  if(state!==ST.PLAY) return;
  let d = (Math.abs(e.deltaX)>Math.abs(e.deltaY)? e.deltaX : e.deltaY);
  if(e.deltaMode===1) d *= 33;   // Firefox sends LINES (~3), not pixels
  wheelAcc += d;
  const step = 99;   // ≈ one physical wheel notch (100px in Chrome, 3 lines×33 in Firefox) → exactly ONE alien (old 50 made ticks jump 2 slots, locking out 3 aliens)
  let guard = 0;
  while(Math.abs(wheelAcc) >= step && guard++ < 12){
    const d = wheelAcc>0?1:-1;
    wheelAcc -= d*step;
    if(!selectUI.open) openSelect(true);
    navSelect(d);
    selectUI.t = 0;
  }
}, {passive:false});

cv.addEventListener('click', e=>{
  const x = e.clientX, y = e.clientY;
  if(state===ST.MENU){
    for(const b of menuBtns){
      if(x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h){ setDifficulty(b.key); return; }
    }
    if(menuSlider && y>=menuSlider.y-16 && y<=menuSlider.y+menuSlider.h+16 && x>=menuSlider.x-10 && x<=menuSlider.x+menuSlider.w+10){
      volume = clamp(1-(y-menuSlider.y)/menuSlider.h, 0, 1);
      try{ localStorage.setItem('omnitrix_vol', String(volume)); }catch(err){}
      audioInit(); tone(700,.08,'sine',.05,900);
    }
    return;
  }
  if(state===ST.OVER){ startGame(); return; }
  if(state===ST.PLAY && selectUI.open && !IS_TOUCH){ confirmSelect(); }
});

// Touch: left half = joystick | right half = aim + fire | buttons bottom-right
const touch = { move:null, aim:null, moveVec:{x:0,y:0}, aimVec:{x:0,y:0} };
function btnCycleTapped(p){ return p.x > W-120 && p.y > H-170 && p.y < H-70; }
function btnTransformTapped(p){ return p.x > W-120 && p.y > H-64; }
cv.addEventListener('touchstart', e=>{
  e.preventDefault(); audioInit();
  if(state!==ST.PLAY){
    for(const t of e.changedTouches){
      const pt = { x:t.clientX, y:t.clientY };
      let hitBtn = false;
      if(state===ST.MENU){
        for(const b of menuBtns){
          if(pt.x>=b.x && pt.x<=b.x+b.w && pt.y>=b.y && pt.y<=b.y+b.h){ setDifficulty(b.key); hitBtn = true; }
        }
        if(!hitBtn && menuSlider && pt.y>=menuSlider.y-18 && pt.y<=menuSlider.y+menuSlider.h+18 && pt.x>=menuSlider.x-12 && pt.x<=menuSlider.x+menuSlider.w+12){
          volume = clamp(1-(pt.y-menuSlider.y)/menuSlider.h, 0, 1);
          try{ localStorage.setItem('omnitrix_vol', String(volume)); }catch(err){}
          audioInit(); tone(700,.08,'sine',.05,900);
          hitBtn = true;
        }
      }
      if(!hitBtn) startGame();
    }
    return;
  }
  for(const t of e.changedTouches){
    const p = { x:t.clientX, y:t.clientY };
    if(selectUI.open){
      if(p.x < W*0.33) navSelect(-1);
      else if(p.x > W*0.67) navSelect(1);
      else confirmSelect();
      continue;
    }
    if(Math.hypot(p.x-(W-36), p.y-36) < 28){ togglePause(); continue; }
    if(btnTransformTapped(p)){ player.transformed ? transformOff() : transformOn(); continue; }
    if(btnCycleTapped(p)){ openSelect(); continue; }
    if(p.x < W/2 && !touch.move){
      touch.move = { id:t.identifier, ox:p.x, oy:p.y, x:p.x, y:p.y };
      touch.moveVec = {x:0,y:0};
    } else if(!touch.aim){
      touch.aim = { id:t.identifier, ox:p.x, oy:p.y, x:p.x, y:p.y };
      touch.aimVec = {x:0,y:0};
      player.aiming = true;
    }
  }
}, {passive:false});
cv.addEventListener('touchmove', e=>{
  e.preventDefault();
  for(const t of e.changedTouches){
    const p = { x:t.clientX, y:t.clientY };
    if(touch.move && t.identifier===touch.move.id){
      touch.move.x=p.x; touch.move.y=p.y;
      const dx=p.x-touch.move.ox, dy=p.y-touch.move.oy, d=Math.hypot(dx,dy);
      if(d>4){ const m=Math.min(1,d/50); touch.moveVec={x:dx/d*m, y:dy/d*m}; }
    } else if(touch.aim && t.identifier===touch.aim.id){
      touch.aim.x=p.x; touch.aim.y=p.y;
      const dx=p.x-touch.aim.ox, dy=p.y-touch.aim.oy, d=Math.hypot(dx,dy);
      if(d>10) touch.aimVec={x:dx/d, y:dy/d};
    }
  }
}, {passive:false});
function endTouch(e){
  for(const t of e.changedTouches){
    if(touch.move && t.identifier===touch.move.id){ touch.move=null; touch.moveVec={x:0,y:0}; }
    if(touch.aim && t.identifier===touch.aim.id){ touch.aim=null; touch.aimVec={x:0,y:0}; player.aiming=false; }
  }
}
cv.addEventListener('touchend', endTouch, {passive:false});
cv.addEventListener('touchcancel', endTouch, {passive:false});

// ---------- Transform ----------
function cycleAlien(){
  player.alien = (player.alien+1) % (ALIENS.length-1);   // secret alien skipped
  dialAnim = 1;
  if(player.transformed) burst(player.x, player.y, ALIENS[player.alien].color, 18, 220);
  tone(500,.08,'square',.03,700);
}
function transformOn(force){
  const p = player;
  if(p.transformed) return;
  if(!force){
    if(p.rechargeCd>0){ floater(p.x,p.y-30,'OMNITRIX RECHARGING…','#ffd23f'); return; }
    if(p.energy < 25){ floater(p.x,p.y-30,'LOW ENERGY','#ff6b6b'); tone(200,.15,'square',.04,120); return; }
  }
  p.transformed = true;
  shake(6,.25); hitFlash = Math.max(hitFlash,.3);
  transformFX = { t:0, dur:0.5, color: ALIENS[p.alien].color };
  burst(p.x, p.y, ALIENS[p.alien].color, 26, 280);
  floater(p.x, p.y-34, ALIENS[p.alien].name+'!', ALIENS[p.alien].color2);
  if(p.alien===6){ godArrival(); }
  else {
    if(!heroTimeDone){ heroTimeDone = true; say("IT'S HERO TIME!", ALIENS[p.alien].name+' — go get them!', '#7dfa4c'); }
    sfx.transform();
  }
}
// Alien X god-mode: screen-clearing arrival + mid-fight ascension
function godArrival(){
  const p = player;
  if(boss){   // even Vilgax can't survive the dawn of Alien X
    const bt = ENEMY.VILGAX;
    kills++; score += bt.score;
    burst(boss.x,boss.y,bt.color,30,420); burst(boss.x,boss.y,'#ffffff',20,520);
    floater(boss.x,boss.y-80,'+'+bt.score,'#ffd23f');
    const bi = enemies.indexOf(boss); if(bi>=0) enemies.splice(bi,1);   // he lives in enemies now — remove before the generic loop
    boss = null;
  }
  for(const e of enemies.slice()){
    const t = ENEMY[e.type];
    kills++; score += t.score;
    burst(e.x,e.y,t.color,16,320); burst(e.x,e.y,t.color2,8,200);
    floater(e.x,e.y-20,'+'+t.score,t.color2);
  }
  enemies.length = 0;
  ebullets.length = 0;
  shockwaves.push({x:p.x,y:p.y,r:12,max:900,spd:1500,dmg:0,hit:new Set(),color:'#ffffff'});
  shockwaves.push({x:p.x,y:p.y,r:12,max:650,spd:1050,dmg:0,hit:new Set(),color:'#c9b8ff'});
  for(let i=0;i<80;i++) particles.push(mkParticle(p.x,p.y,rand(0,TAU),rand(200,680),['#ffffff','#c9b8ff','#8f7bff'][i%3],rand(.4,.95)));
  transformFX = { t:0, dur:0.7, color:'#c9b8ff' };

  shake(14,.6);

function godSwap(){

function omnitrixSymbol(hw, hh){
  // classic Omnitrix face — black dial, colored hourglass
  const col = ctx.fillStyle;
  ctx.fillStyle = '#0c1a08';
  ctx.beginPath(); ctx.arc(0,0,hh*1.24,0,TAU); ctx.fill();
  ctx.fillStyle = col;
  ctx.beginPath(); ctx.moveTo(-hw,-hh);
  ctx.quadraticCurveTo(0,-hh*1.06, hw,-hh);
  ctx.bezierCurveTo(hw*0.58,-hh*0.62, hw*0.18,-hh*0.10, 0,0);
  ctx.bezierCurveTo(-hw*0.18,-hh*0.10, -hw*0.58,-hh*0.62, -hw,-hh);
  ctx.closePath(); ctx.fill();
  ctx.beginPath(); ctx.moveTo(-hw,hh);
  ctx.quadraticCurveTo(0,hh*1.06, hw,hh);
  ctx.bezierCurveTo(hw*0.58,hh*0.62, hw*0.18,hh*0.10, 0,0);
  ctx.bezierCurveTo(-hw*0.18,hh*0.10, -hw*0.58,hh*0.62, -hw,hh);
  ctx.closePath(); ctx.fill();
  ctx.fillStyle = col;
}
function drawSelect(){
  const t = Math.min(1, selectUI.t*4);
  ctx.fillStyle = 'rgba(4,6,12,'+(t*0.86)+')';
  ctx.fillRect(0,0,W,H);
  const cx = W/2, cy = H/2;
  const pulse = 1 + Math.sin(selectUI.t*3)*0.02;
  ctx.save(); ctx.translate(cx,cy); ctx.scale(pulse*t, pulse*t);
  const cur = ALIENS[selectUI.idx];
  ctx.beginPath(); ctx.arc(0,0,86,0,TAU);
  ctx.fillStyle = '#101828'; ctx.fill();
  ctx.lineWidth = 6; ctx.strokeStyle = cur.color; ctx.shadowColor = cur.color; ctx.shadowBlur = 26; ctx.stroke();
  ctx.shadowBlur = 0;
  if(selectUI.idx <= 5){ drawAlienFace(0, -6, selectUI.idx, 52); }
  else { ctx.fillStyle = cur.color; omnitrixSymbol(44, 62); }
  ctx.restore();
  const n = 6, gap = Math.min(130, W/6);
  for(let i=0;i<n;i++){
    let off = i - selectUI.slide;
    if(off > n/2) off -= n; if(off < -n/2) off += n;
    if(Math.abs(off) > 2.5) continue;
    const x = cx + off*gap, y = cy - 150;
    const isCur = i === selectUI.idx;
    const s = isCur ? 1.35 : 1 - Math.min(0.5, Math.abs(off)*0.25);
    ctx.globalAlpha = isCur ? 1 : clamp(0.75 - Math.abs(off)*0.3, 0.15, 0.75);
    drawAlienSilhouette(x, y, i, 26*s);
    ctx.globalAlpha = 1;
  }
  ctx.textAlign = 'center';
  ctx.fillStyle = cur.color; ctx.shadowColor = cur.color; ctx.shadowBlur = 16;
  ctx.font = 'bold 30px Segoe UI';
  ctx.fillText(cur.name, cx, cy + 130);
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#c9d6f2'; ctx.font = '14px Segoe UI';
  ctx.fillText(cur.desc + '   •   drain ' + cur.energyRate + '/s', cx, cy + 156);
  ctx.fillStyle = '#7d8bab'; ctx.font = '12px Segoe UI';
  const hint = IS_TOUCH
    ? 'tap left / right of the dial to browse   •   tap center to transform'
    : 'Scroll or A/D browse   •   1-6 jump   •   Click/E transform   •   Esc cancel';
  ctx.fillText(hint, cx, cy + 184);
  if(player.energy < 25 && !player.transformed){
    ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 13px Segoe UI';
    ctx.fillText('LOW ENERGY — it will time out fast!', cx, cy + 206);
  }
}
// ---------- Alien faces (procedural, show-styled) ----------
// XLR8 — Alien Force look: broad black carapace dipping to a V between the
// eyes, steel-blue mask, big slanted glow-green eyes, wide scowl, chin plate.
function drawXLR8Face(x,y,r){
  ctx.save(); ctx.translate(x,y);
  // Head silhouette: rounded crown point, widest at the eye line, tapered chin.
  const head = function(){
    ctx.beginPath();
    ctx.moveTo(0,-1.3*r);
    ctx.bezierCurveTo(0.80*r,-1.15*r, 1.18*r,-0.55*r, 1.08*r,0.02*r);
    ctx.bezierCurveTo(1.02*r,0.50*r, 0.62*r,1.02*r, 0,1.3*r);
    ctx.bezierCurveTo(-0.62*r,1.02*r, -1.02*r,0.50*r, -1.08*r,0.02*r);
    ctx.bezierCurveTo(-1.18*r,-0.55*r, -0.80*r,-1.15*r, 0,-1.3*r);
    ctx.closePath();
  };
  // 1) black base
  head(); ctx.fillStyle='#101018'; ctx.fill();
  // everything else stays inside the head
  ctx.save(); head(); ctx.clip();
  // 2) steel-blue mask — everything below the carapace edge
  ctx.fillStyle='#59b7dc';
  ctx.fillRect(-1.2*r, 0.30*r, 2.4*r, 1.1*r);
  // 3) carapace underside — sweeps down to the center V (redrawn over the blue)
  ctx.beginPath();
  ctx.moveTo(-1.15*r,-0.10*r);
  ctx.bezierCurveTo(-0.55*r,0.30*r, -0.22*r,0.38*r, 0,0.38*r);
  ctx.bezierCurveTo(0.22*r,0.38*r, 0.55*r,0.30*r, 1.15*r,-0.10*r);
  ctx.lineTo(1.15*r,-1.5*r); ctx.lineTo(-1.15*r,-1.5*r);
  ctx.closePath();
  ctx.fillStyle='#101018'; ctx.fill();
  // glossy sheen on the carapace
  ctx.beginPath(); ctx.ellipse(-0.40*r,-0.72*r, 0.16*r, 0.42*r, 0.30, 0, TAU);
  ctx.fillStyle='rgba(255,255,255,0.30)'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(-0.16*r,-1.00*r, 0.06*r, 0.16*r, 0.25, 0, TAU);
  ctx.fillStyle='rgba(255,255,255,0.42)'; ctx.fill();
  // mask shading — right side
  ctx.beginPath();
  ctx.moveTo(0.15*r,0.30*r); ctx.lineTo(1.1*r,0.30*r);
  ctx.bezierCurveTo(1.02*r,0.55*r, 0.6*r,1.05*r, 0.12*r,1.28*r);
  ctx.closePath();
  ctx.fillStyle='rgba(10,18,38,0.25)'; ctx.fill();
  // 4) nose bridge — thin dark V under the carapace point
  ctx.beginPath();
  ctx.moveTo(0,0.30*r); ctx.lineTo(0.055*r,0.54*r); ctx.lineTo(-0.055*r,0.54*r);
  ctx.closePath(); ctx.fillStyle='#101018'; ctx.fill();
  // 5) eyes — big slanted glow-green almonds with heavy black rims
  for(const s of [-1,1]){
    ctx.save();
    ctx.translate(s*0.48*r, 0.14*r);
    ctx.rotate(-s*0.45);
    ctx.beginPath();
    ctx.moveTo(-0.40*r,0);
    ctx.quadraticCurveTo(0,-0.25*r, 0.40*r,0);
    ctx.quadraticCurveTo(0,0.17*r, -0.40*r,0);
    ctx.closePath();
    ctx.strokeStyle='#0c0c12'; ctx.lineWidth=Math.max(2.5,0.18*r); ctx.stroke();
    ctx.save(); ctx.shadowColor='#54ff3c'; ctx.shadowBlur=0.6*r;
    ctx.fillStyle='#54ff3c'; ctx.fill();
    ctx.restore();
    ctx.restore();
  }
  // 6) scowl — wide, gently down-bowed heavy line
  ctx.beginPath(); ctx.arc(0, 1.02*r, 0.46*r, Math.PI*1.18, Math.PI*1.82);
  ctx.strokeStyle='#0c0c12'; ctx.lineWidth=Math.max(2,0.10*r); ctx.lineCap='round'; ctx.stroke();
  // 7) chin plate
  ctx.beginPath();
  ctx.moveTo(-0.26*r,0.98*r); ctx.lineTo(0.26*r,0.98*r);
  ctx.lineTo(0.14*r,1.22*r); ctx.lineTo(-0.14*r,1.22*r);
  ctx.closePath();
  ctx.fillStyle='#59b7dc'; ctx.fill();
  ctx.strokeStyle='#0c0c12'; ctx.lineWidth=Math.max(1.5,0.06*r); ctx.stroke();
  ctx.restore(); // clip
  ctx.restore(); // translate
}

  ctx.beginPath(); ctx.moveTo(0.30*r,0.55*r); ctx.lineTo(0.10*r,0.62*r); ctx.lineTo(0.05*r,1.00*r); ctx.lineTo(0.20*r,0.95*r); ctx.closePath(); ctx.fill(); ctx.stroke();
  ctx.restore(); ctx.restore();
}
// ---- Ghostfreak: pale head, huge toothy maw, single glowing pink eye ----
function drawGhostfreakFace(x,y,r){
  ctx.save(); ctx.translate(x,y);
  const head = function(){
    ctx.beginPath();
    ctx.moveTo(0,-1.15*r);
    ctx.bezierCurveTo(0.70*r,-1.05*r, 1.00*r,-0.45*r, 0.92*r,0.10*r);
    ctx.bezierCurveTo(0.84*r,0.62*r, 0.50*r,1.05*r, 0,1.12*r);
    ctx.bezierCurveTo(-0.50*r,1.05*r, -0.84*r,0.62*r, -0.92*r,0.10*r);
    ctx.bezierCurveTo(-1.00*r,-0.45*r, -0.70*r,-1.05*r, 0,-1.15*r);
    ctx.closePath();
  };
  head(); ctx.fillStyle='#cdd2b8'; ctx.fill();
  ctx.save(); head(); ctx.clip();
  ctx.fillStyle='rgba(60,70,50,0.25)';
  ctx.beginPath(); ctx.ellipse(0.45*r,-0.2*r,0.5*r,0.9*r,0,0,TAU); ctx.fill();
  // huge maw
  ctx.beginPath();
  ctx.moveTo(-0.72*r,0.28*r);
  ctx.bezierCurveTo(-0.30*r,0.16*r, 0.30*r,0.16*r, 0.72*r,0.28*r);
  ctx.bezierCurveTo(0.55*r,0.85*r, -0.55*r,0.85*r, -0.72*r,0.28*r);
  ctx.closePath();
  ctx.fillStyle='#2a0f1e'; ctx.fill();
  // teeth hanging from the upper lip
  ctx.fillStyle='#e8dfae';
  const teeth = [-0.52,-0.31,-0.10,0.11,0.32,0.53];
  for(let k=0;k<teeth.length-1;k++){
    const x0=teeth[k]*r, x1=teeth[k+1]*r, xm=(x0+x1)/2;
    const t = Math.min(1, Math.abs(xm)/(0.72*r));
    const yTop = 0.19*r + t*0.11*r;

  ctx.save();
  ctx.shadowColor='#ff4fd8'; ctx.shadowBlur=0.5*r;

  ctx.fillStyle='#141018'; ctx.fill();
  ctx.beginPath(); ctx.ellipse(-0.34*r,-0.40*r, 0.05*r, 0.09*r, -0.3, 0, TAU);
  ctx.fillStyle='#ff8ae0'; ctx.fill();
  ctx.restore();
  // wrinkle lines
  ctx.strokeStyle='rgba(60,70,50,0.5)'; ctx.lineWidth=0.035*r;
  ctx.beginPath(); ctx.moveTo(-0.85*r,-0.1*r); ctx.quadraticCurveTo(-0.7*r,0.1*r,-0.75*r,0.3*r); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(0.85*r,-0.1*r); ctx.quadraticCurveTo(0.7*r,0.1*r,0.75*r,0.3*r); ctx.stroke();
  ctx.restore(); ctx.restore();
}
// ---- Grey Matter: wide frog head, giant slit-pupil eyes, thin brow band ----

// ---- dispatcher: every alien's real face ----
function drawAlienFace(x,y,i,r){
  if(i===0) drawHeatblastFace(x,y,r);
  else if(i===1) drawFourArmsFace(x,y,r);
  else if(i===2) drawXLR8Face(x,y,r*0.8);
  else if(i===3) drawDiamondheadFace(x,y,r);
  else if(i===4) drawGhostfreakFace(x,y,r);
