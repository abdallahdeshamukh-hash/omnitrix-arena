function drawAlienSilhouette(x,y,i,r){
  if(i>=0 && i<=5){ drawAlienFace(x,y,i,r*0.78); return; }
  const al = ALIENS[i];
  ctx.save(); ctx.translate(x,y);
  ctx.fillStyle = al.color; ctx.shadowColor = al.color; ctx.shadowBlur = 18;
  if(i===1){ ctx.beginPath(); ctx.ellipse(0,0,r*1.15,r,0,0,TAU); ctx.fill(); }
  else if(i===3){ ctx.beginPath(); for(let k=0;k<6;k++){ const aa=k*TAU/6; ctx[k?'lineTo':'moveTo'](Math.cos(aa)*r*(k%2?0.85:1.15), Math.sin(aa)*r*(k%2?0.85:1.15)); } ctx.closePath(); ctx.fill(); }
  else if(i===5){ ctx.beginPath(); ctx.arc(0,0,r*0.6,0,TAU); ctx.fill(); }
  else { ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill(); }
  ctx.shadowBlur = 0;
  ctx.fillStyle = '#101522';
  if(i===2){ ctx.beginPath(); ctx.ellipse(0,0,r*0.55,r*0.2,0,0,TAU); ctx.fill(); }
  else { for(const s of [-1,1]){ ctx.beginPath(); ctx.arc(s*r*0.32, -r*0.1, r*0.14, 0, TAU); ctx.fill(); } }
  ctx.restore();
}
function drawTransformFX(){
  const f = transformFX, k = f.t/f.dur;
  const px = player.x - cam.x, py = player.y - cam.y;
  ctx.fillStyle = 'rgba(255,255,255,'+(0.75*(1-k))+')';
  ctx.fillRect(0,0,W,H);
  ctx.save(); ctx.translate(px,py);
  ctx.strokeStyle = f.color; ctx.lineWidth = Math.max(1,5*(1-k)); ctx.globalAlpha = (1-k);
  for(let i=0;i<14;i++){
    const aa = i*TAU/14 + 0.3;
    const r1 = 40 + k*420, r2 = r1 + 60;
    ctx.beginPath(); ctx.moveTo(Math.cos(aa)*r1, Math.sin(aa)*r1);
    ctx.lineTo(Math.cos(aa)*r2, Math.sin(aa)*r2); ctx.stroke();
  }
  ctx.globalAlpha = (1-k)*0.9; ctx.lineWidth = Math.max(1,8*(1-k)+2);
  ctx.beginPath(); ctx.arc(0,0, 30+k*360, 0, TAU); ctx.stroke();
  ctx.restore(); ctx.globalAlpha = 1;
}
function transformOff(timedOut){
  const p = player;
  if(!p.transformed) return;
  p.transformed = false;
  p.dashT = 0;
  if(timedOut){ p.rechargeCd = 2.5; say('OMNITRIX TIMED OUT','Recharging…','#ffd23f'); }
  else p.iFrames = Math.max(p.iFrames, 0.8);
  burst(p.x, p.y, '#7dfa4c', 26, 280);
  floater(p.x, p.y-30, timedOut ? 'BEN…' : 'BEN', '#7dfa4c');
  sfx.revert();
}

// ---------- Game flow ----------
function startGame(){
  audioInit();
  state = ST.PLAY;
  boss = null;
  Object.assign(player, {
    x:world.w/2, y:world.h/2, vx:0, vy:0, hp:100, maxHp:100,
    alien:0, transformed:false, energy:100, maxEnergy:100, rechargeCd:0, iFrames:1,
    dashT:0, dashDx:0, dashDy:0, dashHit:null, fireCd:0, flameT:0, faceX:1, faceY:0, moveX:0, moveY:0, aiming:false,
  });
  bullets=[]; ebullets=[]; enemies=[]; particles=[]; pickups=[]; floaters=[]; shockwaves=[];
  spawnQueue=[]; spawnT=0; wave=0; waveTimer=2.2; betweenWaves=true;
  score=0; kills=0; shakeT=0; shakeMag=0; hitFlash=0; dialAnim=0; paused=false;
  announce=null; announceT=0;
  selectUI = { open:false, idx:0, t:0, slide:0, auto:false };
  transformFX = null; heroTimeDone = false; dialGlow = 0; energyBeepT = 0;
  say('WAVE 1','Get ready!','#7dfa4c');
}
function gameOver(){
  state = ST.OVER;
  boss = null;
  selectUI.open = false; transformFX = null;
  if(score > best){ best = score; try{ localStorage.setItem('omnitrix_best', String(best)); }catch(e){} }
  sfx.explode();
}

// ---------- Update ----------
function update(dt){
  time += dt;
  if(state !== ST.PLAY) return;
  if(paused) return;
  const p = player;
  const rdt = dt;
  if(selectUI.open) dt *= 0.15;   // dial slow-mo

  // --- movement input ---
  let mx = 0, my = 0;
  if(keys['a']||keys['arrowleft']) mx -= 1;
  if(keys['d']||keys['arrowright']) mx += 1;
  if(keys['w']||keys['arrowup']) my -= 1;
  if(keys['s']||keys['arrowdown']) my += 1;
  if(touch.moveVec.x || touch.moveVec.y){ mx = touch.moveVec.x; my = touch.moveVec.y; }
  const ml = Math.hypot(mx,my);
  if(ml>1){ mx/=ml; my/=ml; }
  p.moveX = mx; p.moveY = my;

  // --- aim ---
  if(touch.aimVec.x || touch.aimVec.y){ p.faceX = touch.aimVec.x; p.faceY = touch.aimVec.y; }
  else if(!IS_TOUCH){
    const sx = p.x - cam.x, sy = p.y - cam.y;
    const dx = mouse.x - sx, dy = mouse.y - sy, d = Math.hypot(dx,dy);
    if(d>6){ p.faceX = dx/d; p.faceY = dy/d; }
  } else if(ml>0.1){ p.faceX = mx/ml; p.faceY = my/ml; }

  // --- dash (XLR8) ---
  if(p.dashT > 0){
    p.dashT -= dt;
    const dspd = 900;
    p.x += p.dashDx*dspd*dt; p.y += p.dashDy*dspd*dt;
    p.vx = p.dashDx*dspd; p.vy = p.dashDy*dspd;
    particles.push(mkParticle(p.x,p.y, rand(0,TAU), rand(20,80), '#7ee3ff', .25));
    // dash damage
    for(const e of enemies){
      if(p.dashHit && !p.dashHit.has(e) && dist(p.x,p.y,e.x,e.y) < p.r+e.r+4){
        p.dashHit.add(e);
        damageEnemy(e, 20, p.dashDx, p.dashDy);
      }
    }
  } else {
    const spd = p.transformed ? ALIENS[p.alien].speed : 260;
    p.vx = mx*spd; p.vy = my*spd;
    p.x += p.vx*dt; p.y += p.vy*dt;
  }
  p.x = clamp(p.x, 30, world.w-30);
  p.y = clamp(p.y, 30, world.h-30);

  // --- attack ---
  const wantFire = !selectUI.open && (keys[' '] || keys['j'] || mouse.down || (touch.aim !== null));
  if(wantFire){
    if(p.transformed) fire();
    else if(p.fireCd<=0){ p.fireCd = 0.6; floater(p.x, p.y-26, 'Press E to transform!', '#7dfa4c'); }
  }
  p.fireCd -= dt;

  // --- energy (Alien X: zero drain, never times out) ---
  if(p.transformed){
    if(p.alien!==6) p.energy -= ALIENS[p.alien].energyRate * DIFF.drain * dt;
    if(p.energy <= 0){ p.energy = 0; transformOff(true); }
  } else {
    p.energy = Math.min(p.maxEnergy, p.energy + 20*dt);
  }
  p.rechargeCd = Math.max(0, p.rechargeCd - dt);
  p.iFrames = Math.max(0, p.iFrames - dt);
  dialAnim = Math.max(0, dialAnim - dt*3);
  dialGlow = Math.max(0, dialGlow - dt*2);
  selectUI.t += rdt;
  selectUI.slide += (selectUI.idx - selectUI.slide)*Math.min(1,rdt*12);
  if(selectUI.open && selectUI.auto && selectUI.t>2.2) closeSelect();   // scroll-opened dial auto-closes
  if(transformFX){ transformFX.t += rdt; if(transformFX.t >= transformFX.dur) transformFX = null; }
  if(p.transformed && p.energy < 25){
    energyBeepT -= rdt;
    dialGlow = 1;
    if(energyBeepT<=0){ energyBeepT = 0.5; tone(880,.07,'square',.03,660); }
  } else energyBeepT = 0;

  // heatblast ambience
  if(p.transformed && p.alien===0){
    p.flameT -= dt;
    if(p.flameT<=0){ p.flameT = 0.06; particles.push(mkParticle(p.x+rand(-6,6),p.y+rand(-6,6),rand(0,TAU),rand(10,60),Math.random()<.5?'#ff7b24':'#ffd23f',rand(.2,.4))); }
  }

  // --- spawn queue ---
  if(spawnQueue.length){
    spawnT -= dt;
    if(spawnT<=0){ spawnEnemy(spawnQueue.shift()); spawnT = 0.35 * DIFF.gap; }
  } else if(!betweenWaves && enemies.length===0 && !boss){
    score += 50*wave;
    floater(p.x, p.y-50, 'WAVE '+wave+' CLEAR! +'+(50*wave), '#7dfa4c');
    betweenWaves = true; waveTimer = DIFF.break;
    sfx.wave();
  }
  if(betweenWaves){
    waveTimer -= dt;
    if(waveTimer<=0){
      wave++;
      spawnQueue = buildWave(wave);
      spawnT = 0.1;
      betweenWaves = false;
      say('WAVE '+wave, wave>=4 && wave%2===0 ? 'A Warbot detected!' : (wave%5===0 ? 'VILGAX IS HERE!!' : 'Here they come!'), wave%5===0 ? '#ff5964' : '#ff9a3d');
      if(wave%5===0) sfx.bossRoar();
      sfx.wave();
    }
  }

  // --- enemies (Alien X time aura slows them and their bullets) ---
  const edt = (p.transformed && p.alien===6) ? dt*0.45 : dt;
  for(const e of enemies){
    const dt = edt;
    e.t += dt; e.hitT = Math.max(0, e.hitT-dt);
    const dx = p.x-e.x, dy = p.y-e.y, d = Math.hypot(dx,dy)||1;
    const nx = dx/d, ny = dy/d;
    if(e.type==='DNALIEN'){
      if(e.lungeT > 0){
        e.lungeT -= dt;
        e.vx = e.lungeDx*430; e.vy = e.lungeDy*430;
        if(Math.random()<0.5) particles.push(mkParticle(e.x,e.y,rand(0,TAU),rand(10,60),'#9db92c',.3));
      } else {
        e.lungeCd -= dt;
        const wob = Math.sin(e.t*3+e.phase)*0.5;
        e.vx = (nx*Math.cos(wob)-ny*Math.sin(wob))*e.spd;
        e.vy = (nx*Math.sin(wob)+ny*Math.cos(wob))*e.spd;
        if(e.lungeCd<=0 && d<240 && d>60){
          e.lungeT = 0.45; e.lungeCd = rand(1.8,2.6);
          e.lungeDx = nx; e.lungeDy = ny;
          tone(180,.15,'sawtooth',.02,90);
        }
      }
    } else if(e.type==='XENOCITE'){
      const s = Math.sin(e.t*9+e.phase)*150;
      e.vx = nx*e.spd - ny*s;
      e.vy = ny*e.spd + nx*s;
    } else if(e.type==='SENTRY'){
      e.ax = nx; e.ay = ny;
      if(e.burstLeft > 0){
        e.vx = e.vy = 0;
        e.burstT -= dt;
        if(e.burstT<=0){
          e.burstT = 0.09; e.burstLeft--;
          ebullets.push({x:e.x,y:e.y,vx:nx*300,vy:ny*300,r:5,dmg:ENEMY.SENTRY.dmg,life:2.4,c1:'#ff4646',c2:'#ffd0d0'});
          tone(700,.06,'square',.02,300);
        }
      } else if(e.chargeT > 0){
        e.chargeT -= dt;
        e.vx = -ny*40; e.vy = nx*40;
        if(e.chargeT<=0){ e.burstLeft = 3; e.burstT = 0; }
      } else {
        const want = 340;
        const dir = d>want?1:(d<260?-0.7:0);
        e.vx = nx*e.spd*dir; e.vy = ny*e.spd*dir;
        e.fireCd -= dt;
        if(e.fireCd<=0 && d<620){ e.chargeT = 0.65; e.fireCd = rand(2.2,3.2); }
      }
    } else if(e.type==='VILGAX'){      // ============ BOSS: VILGAX ============
      const enrage = e.hp < e.maxHp*0.5;
      if(enrage && !e.enraged){ e.enraged = true; say('VILGAX IS ENRAGED!', 'He\'s not holding back!', '#ff5964'); sfx.bossRoar(); shake(12,.6); }
      const er = enrage ? 0.72 : 1;                       // cooldown multiplier
      e.fireCd -= dt; e.slamCd -= dt; e.burstCd -= dt; e.summonCd -= dt;
      if(e.slamT > 0){                                    // ground-slam recovery
        e.slamT -= dt; e.vx = e.vy = 0;
        if(e.slamT<=0){
          shockwaves.push({x:e.x,y:e.y,r:20,max:430,spd:560,dmg:0,hit:new Set(),color:'#ff9a3d'});
          shake(14,.5); sfx.bossSlam();
        }
      } else if(e.burstN > 0){                            // radial burst venting
        e.vx = e.vy = 0;
        e.burstT -= dt;
        if(e.burstT<=0){
          e.burstT = 0.11; e.burstN--;
          const off = e.burstN%2 ? 0.14 : 0;
          for(let k=0;k<8;k++){
            const aa = k*TAU/8 + off + e.t;
            ebullets.push({x:e.x,y:e.y,vx:Math.cos(aa)*180,vy:Math.sin(aa)*180,r:7,dmg:Math.round(9*DIFF.dmg),life:3.2,c1:'#ff5964',c2:'#ffd6da'});
          }
          tone(160,.12,'sawtooth',.05,80);
        }
      } else {
        if(d > 320){ e.vx = nx*e.spd; e.vy = ny*e.spd; }          // close in
        else if(d < 170){ e.vx = -nx*e.spd*0.6; e.vy = -ny*e.spd*0.6; } // back off
        else { const slide = Math.sin(e.t*1.6)*0.8; e.vx = (nx*Math.cos(slide)-ny*Math.sin(slide))*e.spd*0.7; e.vy = (nx*Math.sin(slide)+ny*Math.cos(slide))*e.spd*0.7; }
        if(e.slamCd<=0 && d < 230){                       // leap slam
          e.slamT = 0.85; e.slamCd = rand(6.5,8.5)*er;
          tone(110,.5,'sawtooth',.06,50);
        } else if(e.burstCd<=0){                          // radial burst
          e.burstN = enrage ? 6 : 4; e.burstT = 0; e.burstCd = rand(7,9)*er;
        } else if(e.fireCd<=0 && d < 700){                // eye lasers
          e.fireCd = rand(2.6,3.4)*er;
          for(const s of [-0.16,0.16]){
            ebullets.push({x:e.x,y:e.y+10,vx:nx*300,vy:ny*300,r:6,dmg:Math.round(12*DIFF.dmg),life:3,c1:'#ff5964',c2:'#ffd6da'});
          }
          sfx.bossLaser();
        } else if(e.summonCd<=0){                         // call drones
          e.summonCd = rand(10,13)*er;
          const n2 = enrage ? 3 : 2;
          for(let k=0;k<n2;k++) spawnEnemy(Math.random()<0.5?'DNALIEN':'SENTRY');
          floater(e.x, e.y-e.r-26, 'SUMMONING DRONES', '#ff9a3d');
        }
      }
    } else { // WARBOT
      e.vx = nx*e.spd; e.vy = ny*e.spd;
      e.fireCd -= dt;
      if(e.fireCd<=0 && d<560){
        e.fireCd = rand(3,3.8);
        const base = Math.atan2(ny,nx);
        for(const s of [-0.28,0,0.28]){
          ebullets.push({x:e.x,y:e.y,vx:Math.cos(base+s)*210,vy:Math.sin(base+s)*210,r:7,dmg:11,life:3,c1:'#b26bff',c2:'#e6ccff'});
        }
        tone(150,.2,'sawtooth',.04,60);
      }
    }
    e.x += e.vx*dt; e.y += e.vy*dt;
    e.x = clamp(e.x, e.r, world.w-e.r);
    e.y = clamp(e.y, e.r, world.h-e.r);
    // contact damage (Alien X: fully untouchable; Ghostfreak: 70% phase chance)
    if(e.type!=='VILGAX' && d < e.r+p.r && p.iFrames<=0 && p.dashT<=0){
      if(p.transformed && p.alien===6){
        if(Math.random()<0.1) burst(p.x,p.y,'#c9b8ff',3,90);
      } else if(p.transformed && p.alien===4 && Math.random()<0.7){
        if(Math.random()<0.2) burst(p.x,p.y,'#b9a8ff',3,100);
      } else {
        hurtPlayer(e.dmg, nx, ny);
      }
    }
  }
  // enemy separation (light)
  for(let i=0;i<enemies.length;i++) for(let j=i+1;j<enemies.length;j++){
    const a=enemies[i], b=enemies[j];
    const dx=b.x-a.x, dy=b.y-a.y, d=Math.hypot(dx,dy)||1, min=a.r+b.r;
    if(d<min){ const push=(min-d)/2, ux=dx/d, uy=dy/d;
      a.x-=ux*push; a.y-=uy*push; b.x+=ux*push; b.y+=uy*push; }
  }

  // --- bullets ---
  for(let i=bullets.length-1;i>=0;i--){
    const b = bullets[i];
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.life-=dt;
    if(b.kind==='fire' && Math.random()<0.4) particles.push(mkParticle(b.x,b.y,rand(0,TAU),rand(10,40),'#ff9a3d',.2));
    let dead = b.life<=0 || b.x<0||b.x>world.w||b.y<0||b.y>world.h;
    if(!dead){
      for(const e of enemies){
        if(b.hitSet.has(e)) continue;
        if(dist(b.x,b.y,e.x,e.y) < e.r+b.r){
          damageEnemy(e, b.dmg, b.vx, b.vy);
          b.hitSet.add(e);
          if(!b.pierce){ dead = true; break; }
        }
      }
    }
    if(dead) bullets.splice(i,1);
  }
  for(let i=ebullets.length-1;i>=0;i--){
    const b = ebullets[i];
    const bslow = (p.transformed && p.alien===6) ? 0.45 : 1;
    b.x+=b.vx*dt*bslow; b.y+=b.vy*dt*bslow; b.life-=dt;
    let dead = b.life<=0;
    if(!dead && dist(b.x,b.y,p.x,p.y) < p.r+b.r){
      if(p.transformed && p.alien===6){ burst(p.x,p.y,'#c9b8ff',4,120); }
      else if(p.transformed && p.alien===4 && Math.random()<0.7){ burst(p.x,p.y,'#b9a8ff',4,120); }
      else if(p.iFrames<=0){ hurtPlayer(b.dmg, b.vx, b.vy); }
      dead = true;
    }
    if(dead){ burst(b.x,b.y,b.c2,6,120); ebullets.splice(i,1); }
  }

  // --- shockwaves ---
  for(let i=shockwaves.length-1;i>=0;i--){
    const s = shockwaves[i];
    s.r += s.spd*dt;
    for(const e of enemies){
      if(s.hit.has(e)) continue;
      if(dist(s.x,s.y,e.x,e.y) < s.r+e.r){
        s.hit.add(e);
        const dx=e.x-s.x, dy=e.y-s.y, d=Math.hypot(dx,dy)||1;
        damageEnemy(e, s.dmg, dx/d*400, dy/d*400);
      }
    }
    if(s.r>=s.max) shockwaves.splice(i,1);
  }

  // --- pickups ---
  for(let i=pickups.length-1;i>=0;i--){
    const pk = pickups[i];
    pk.t += dt; pk.life -= dt;
    const d = dist(pk.x,pk.y,p.x,p.y);
    if(d < 70){ pk.x += (p.x-pk.x)/d*300*dt; pk.y += (p.y-pk.y)/d*300*dt; }
    if(d < p.r+12){
      if(pk.kind==='energy'){ p.energy = Math.min(p.maxEnergy, p.energy+30); floater(pk.x,pk.y-14,'+30 ENERGY','#7dfa4c'); }
      else { p.hp = Math.min(p.maxHp, p.hp+20); floater(pk.x,pk.y-14,'+20 HP','#ff6b8d'); }
      sfx.pickup();
      pickups.splice(i,1); continue;
    }
    if(pk.life<=0) pickups.splice(i,1);
  }

  // --- particles / floaters ---
  for(let i=particles.length-1;i>=0;i--){
    const q=particles[i]; q.t+=dt; q.x+=q.vx*dt; q.y+=q.vy*dt; q.vx*=0.98; q.vy*=0.98;
    if(q.t>=q.life) particles.splice(i,1);
  }
  for(let i=floaters.length-1;i>=0;i--){
    const f=floaters[i]; f.t+=dt; f.y-=40*dt;
    if(f.t>1.2) floaters.splice(i,1);
  }
  announceT = Math.max(0, announceT-dt);

  // --- camera ---
  const tx = W>=world.w ? (world.w-W)/2 : clamp(p.x-W/2, 0, world.w-W);
  const ty = H>=world.h ? (world.h-H)/2 : clamp(p.y-H/2, 0, world.h-H);
  cam.x += (tx-cam.x)*Math.min(1,dt*8);
  cam.y += (ty-cam.y)*Math.min(1,dt*8);

  shakeT = Math.max(0, shakeT-dt);
  if(shakeT<=0) shakeMag = 0;
  hitFlash = Math.max(0, hitFlash-dt*1.5);
}

function damageEnemy(e, dmg, kx, ky){
  e.hp -= dmg; e.hitT = 0.12;
  if(kx||ky){ const kl = Math.hypot(kx,ky)||1; const push = e.type==='VILGAX'?24:e.type==='WARBOT'?40:140;
    e.x = clamp(e.x + kx/kl*(push/Math.max(1,Math.hypot(kx,ky)/200)), e.r, world.w-e.r);
    e.y = clamp(e.y + ky/kl*(push/Math.max(1,Math.hypot(kx,ky)/200)), e.r, world.h-e.r);
  }
  if(e.hp<=0){
    const t = ENEMY[e.type];
    if(e.type==='VILGAX'){                      // ===== VILGAX DEFEATED =====
      boss = null;
      enemies.splice(enemies.indexOf(e),1);
      kills++; score += t.score;
      shockwaves.push({x:e.x,y:e.y,r:10,max:1000,spd:900,dmg:0,hit:new Set(),color:'#ffffff'});
      shockwaves.push({x:e.x,y:e.y,r:10,max:700,spd:600,dmg:0,hit:new Set(),color:'#ff5964'});
      burst(e.x,e.y,'#ff5964',60,560); burst(e.x,e.y,'#ffffff',40,700); burst(e.x,e.y,'#ff9a3d',30,420);
      const eb = Math.round(3+wave*5);
      score += eb; floater(e.x, e.y-80, 'VILGAX DEFEATED! +'+t.score+' +'+eb, '#ffd23f');
      say('VILGAX DEFEATED!', 'The galaxy is safe… for now.', '#ffd23f');
      player.energy = player.maxEnergy; player.hp = Math.min(player.maxHp, player.hp+35);
      pickups.push({x:e.x-40,y:e.y,kind:'hp',t:0,life:15});
      pickups.push({x:e.x+40,y:e.y,kind:'energy',t:0,life:15});
      pickups.push({x:e.x,y:e.y+40,kind:'hp',t:0,life:15});
      shake(18,1); hitFlash = 0.4; transformFX = { t:0, dur:0.9, color:'#ffffff' };
      sfx.bossDefeat();
      return;
    }
    enemies.splice(enemies.indexOf(e),1);
    kills++; score += t.score;
    burst(e.x,e.y,t.color,20,320);
    burst(e.x,e.y,t.color2,10,180);
    shockwaves.push({x:e.x,y:e.y,r:4,max:e.r*2.2,spd:e.r*8,dmg:0,hit:new Set(),color:t.color2});
    floater(e.x,e.y-20,'+'+t.score,t.color2);
    shake(3,.15); sfx.explode();
    const roll = Math.random();
    if(e.type==='XENOCITE') burst(e.x,e.y,'#9db92c',8,200);
    const eC = Math.min(0.45, 0.22*DIFF.drop), hC = Math.min(0.55, 0.30*DIFF.drop);
    if(roll<eC) pickups.push({x:e.x,y:e.y,kind:'energy',t:0,life:12});
    else if(roll<hC) pickups.push({x:e.x,y:e.y,kind:'hp',t:0,life:12});
  } else {
    sfx.hit();
  }
}
function hurtPlayer(dmg, nx, ny){
  const p = player;
  if(p.transformed && p.alien===3) dmg = Math.ceil(dmg*0.65); // diamondhead
  p.hp -= dmg;
  p.iFrames = 0.8;
  hitFlash = 0.6; shake(7,.3);
  p.x = clamp(p.x + nx*18, 30, world.w-30);
  p.y = clamp(p.y + ny*18, 30, world.h-30);
  floater(p.x, p.y-26, '-'+dmg, '#ff6b6b');
  sfx.hurt();
  if(p.hp<=0){ p.hp=0; gameOver(); }
}

// ---------- Drawing ----------
function draw(){
  ctx.clearRect(0,0,W,H);
  // void bg
  const bgGrad = ctx.createRadialGradient(W/2,H/2,50,W/2,H/2,Math.max(W,H)*0.8);
  bgGrad.addColorStop(0,'#0a1020'); bgGrad.addColorStop(1,'#04060c');
  ctx.fillStyle = bgGrad; ctx.fillRect(0,0,W,H);

  if(state===ST.MENU){ drawMenu(); return; }

  ctx.save();
  let ox=0, oy=0;
  if(shakeT>0 && !paused){ ox=rand(-shakeMag,shakeMag); oy=rand(-shakeMag,shakeMag); }
  ctx.translate(-cam.x+ox, -cam.y+oy);

  // arena
  ctx.fillStyle = '#0a0f1e';
  ctx.fillRect(0,0,world.w,world.h);
  ctx.strokeStyle = 'rgba(90,140,255,0.08)'; ctx.lineWidth = 1;
  ctx.beginPath();
  for(let x=0;x<=world.w;x+=100){ ctx.moveTo(x,0); ctx.lineTo(x,world.h); }
  for(let y=0;y<=world.h;y+=100){ ctx.moveTo(0,y); ctx.lineTo(world.w,y); }
  ctx.stroke();
  ctx.strokeStyle = 'rgba(125,250,76,0.5)'; ctx.lineWidth = 4;
  ctx.strokeRect(2,2,world.w-4,world.h-4);
  ctx.strokeStyle = 'rgba(125,250,76,0.15)'; ctx.lineWidth = 14;
  ctx.strokeRect(2,2,world.w-4,world.h-4);

  // pickups
  for(const pk of pickups){
    const bob = Math.sin(pk.t*4)*4;
    const fade = pk.life<3 ? (Math.sin(pk.life*10)>0?1:0.25) : 1;
    ctx.globalAlpha = fade;
    const col = pk.kind==='energy' ? '#7dfa4c' : '#ff6b8d';
    ctx.shadowColor = col; ctx.shadowBlur = 14;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(pk.x, pk.y+bob, 9, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#05070d';
    ctx.font = 'bold 10px Segoe UI'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(pk.kind==='energy'?'E':'+', pk.x, pk.y+bob+0.5);
    ctx.globalAlpha = 1;
  }

  // shockwaves
  for(const s of shockwaves){
    ctx.globalAlpha = clamp(1 - s.r/s.max, 0, 1)*0.8;
    ctx.strokeStyle = s.color; ctx.lineWidth = 5;
    ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,TAU); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // enemies
  for(const e of enemies) drawEnemy(e);

  // enemy bullets
  ctx.globalCompositeOperation = 'lighter';
  for(const b of ebullets){
    ctx.fillStyle = b.c1; ctx.shadowColor=b.c1; ctx.shadowBlur=12;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }
  // player bullets
  for(const b of bullets){
    ctx.fillStyle = b.c1; ctx.shadowColor=b.c1; ctx.shadowBlur=14;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,TAU); ctx.fill();
    ctx.fillStyle = b.c2;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*0.5,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  }
  ctx.globalCompositeOperation = 'source-over';

  drawPlayer();

  // particles
  ctx.globalCompositeOperation = 'lighter';
  for(const q of particles){
    ctx.globalAlpha = clamp(1-q.t/q.life,0,1);
    ctx.fillStyle = q.color;
    ctx.beginPath(); ctx.arc(q.x,q.y,q.r,0,TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
  ctx.globalCompositeOperation = 'source-over';

  // floaters
  ctx.textAlign='center';
  for(const f of floaters){
    ctx.globalAlpha = clamp(1.2-f.t,0,1);
    ctx.fillStyle = f.color;
    ctx.font = 'bold 15px Segoe UI';
    ctx.fillText(f.txt, f.x, f.y);
  }
  ctx.globalAlpha = 1;
  ctx.restore();

  drawHUD();

  if(transformFX) drawTransformFX();
  if(selectUI.open) drawSelect();

  if(paused){
    ctx.fillStyle='rgba(4,6,12,0.7)'; ctx.fillRect(0,0,W,H);
    ctx.textAlign='center';
    ctx.fillStyle='#7dfa4c'; ctx.shadowColor='#7dfa4c'; ctx.shadowBlur=20;
    ctx.font='bold 46px Segoe UI';
    ctx.fillText('PAUSED', W/2, H*0.42);
    ctx.shadowBlur=0;
    ctx.fillStyle='#dfe8ff'; ctx.font='16px Segoe UI';
    ctx.fillText('Score '+score+'   •   Wave '+Math.max(1,wave)+'   •   '+DIFF.label, W/2, H*0.42+38);
    ctx.fillStyle='#9fb3d9'; ctx.font='14px Segoe UI';
    ctx.fillText((IS_TOUCH?'tap ⏸ to resume':'P or Esc to resume'), W/2, H*0.42+64);
  }

  if(hitFlash>0){
    ctx.fillStyle = 'rgba(255,60,60,'+(hitFlash*0.25)+')';
    ctx.fillRect(0,0,W,H);
  }
  if(announceT>0 && announce){
    const a = Math.min(1, announceT/0.4);
    ctx.globalAlpha = a;
    ctx.textAlign='center';
    ctx.fillStyle = announce.col;
    ctx.shadowColor = announce.col; ctx.shadowBlur = 20;
    ctx.font = 'bold 52px Segoe UI';
    ctx.fillText(announce.txt, W/2, H*0.34);
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#dfe8ff'; ctx.font = '20px Segoe UI';
    ctx.fillText(announce.sub, W/2, H*0.34+36);
    ctx.globalAlpha = 1;
  }
  if(state===ST.OVER) drawOver();
}

function drawFlame(x,y,h,color,sp){
  ctx.fillStyle=color;
  const wob = (i,ph)=> Math.sin(time*9*sp+ph+i*2.1)*0.16;
  ctx.beginPath();
  ctx.moveTo(x-h*0.5, y);
  ctx.quadraticCurveTo(x-h*0.62+wob(1,0)*h*0.4, y-h*0.55, x+wob(2,1.3)*h*0.3, y-h);
  ctx.quadraticCurveTo(x+h*0.62+wob(3,2.1)*h*0.4, y-h*0.55, x+h*0.5, y);
  ctx.closePath(); ctx.fill();
}
function drawPlayer(){
  const p = player;
  const blink = p.iFrames>0 && Math.floor(time*14)%2===0;
  ctx.save();
  ctx.translate(p.x,p.y);
  if(blink) ctx.globalAlpha = 0.4;
  if(p.transformed && p.alien===4) ctx.globalAlpha *= 0.55;

  // shadow
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0, p.r*0.9, p.r*0.9, p.r*0.35, 0, 0, TAU); ctx.fill();

  const faceA = Math.atan2(p.faceY,p.faceX);
  const fx = Math.cos(faceA), fy = Math.sin(faceA);
  const px2 = -fy, py2 = fx;             // perpendicular
  const r = p.transformed ? ALIENS[p.alien].r : 15;
  const ai = p.transformed ? p.alien : -1;

  if(ai===0){ // ===== HEATBLAST: magma body, glowing cracks, flame head =====
    const g = ctx.createRadialGradient(-r*0.3,-r*0.2,2,0,0,r*1.1);
    g.addColorStop(0,'#6b3a1f'); g.addColorStop(1,'#241209');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,r*0.12,r*0.95,r*0.88,0,0,TAU); ctx.fill();
    ctx.strokeStyle='#ff7b24'; ctx.lineWidth=2; ctx.lineCap='round';
    ctx.shadowColor='#ff7b24'; ctx.shadowBlur=8;
    for(const [x1,y1,x2,y2] of [[-0.5,-0.1,0.1,0.25],[-0.2,0.4,0.45,0.3],[0.55,-0.25,0.15,0.1]]){
      ctx.beginPath(); ctx.moveTo(x1*r,y1*r);
      ctx.quadraticCurveTo((x1+x2)/2*r + r*0.08*Math.sin(time*3+x1*9), (y1+y2)/2*r, x2*r,y2*r);
      ctx.stroke();
    }
    ctx.shadowBlur=0;
    for(const s of [-1,1]){
      ctx.fillStyle='#ffd23f';
      ctx.beginPath(); ctx.arc(fx*r*0.42+px2*s*r*0.34, fy*r*0.42+py2*s*r*0.34, r*0.16,0,TAU); ctx.fill();
      ctx.fillStyle='#241209';
      ctx.beginPath(); ctx.arc(fx*r*0.5+px2*s*r*0.34, fy*r*0.5+py2*s*r*0.34, r*0.07,0,TAU); ctx.fill();
    }
    drawFlame(0,-r*0.62, r*1.05, '#ff7b24', 1.0);
    drawFlame(0,-r*0.60, r*0.72, '#ffd23f', 1.12);
    drawFlame(0,-r*0.58, r*0.42, '#fff3b0', 1.25);
  } else if(ai===1){ // ===== FOUR ARMS: 4 thick arms, 4 eyes, trunks =====
    const armA=[0.8,2.35,-0.8,-2.35];
    for(let i=0;i<4;i++){
      const aa=armA[i]+Math.sin(time*4+i)*0.06;
      const sx=Math.cos(aa)*r*0.75, sy=Math.sin(aa)*r*0.6;
      const ex=Math.cos(aa)*r*1.45, ey=Math.sin(aa)*r*1.15;
      ctx.strokeStyle='#c1121f'; ctx.lineWidth=r*0.34; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(sx,sy); ctx.lineTo(ex,ey); ctx.stroke();
      ctx.fillStyle='#e63946';
      ctx.beginPath(); ctx.arc(ex,ey,r*0.26,0,TAU); ctx.fill();
    }
    const g = ctx.createRadialGradient(-r*0.25,-r*0.25,2,0,0,r);
    g.addColorStop(0,'#e97b7f'); g.addColorStop(1,'#c1121f');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,r*1.02,r*0.95,0,0,TAU); ctx.fill();
    ctx.fillStyle='#1d2129';
    ctx.beginPath(); ctx.ellipse(0,r*0.62,r*0.72,r*0.4,0,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      for(const [fd,er] of [[0.3,0.11],[0.62,0.13]]){
        ctx.fillStyle='#f8edeb';
        ctx.beginPath(); ctx.arc(fx*r*fd+px2*s*r*0.3, fy*r*fd+py2*s*r*0.3, er*r,0,TAU); ctx.fill();
        ctx.fillStyle='#101522';
        ctx.beginPath(); ctx.arc(fx*(r*fd+r*0.045)+px2*s*r*0.3, fy*(r*fd+r*0.045)+py2*s*r*0.3, er*r*0.45,0,TAU); ctx.fill();
      }
    }
    ctx.strokeStyle='#7f1d1d'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(fx*r*0.75-px2*r*0.18, fy*r*0.75-py2*r*0.18);
    ctx.lineTo(fx*r*0.75+px2*r*0.18, fy*r*0.75+py2*r*0.18); ctx.stroke();
    ctx.fillStyle='#5ad42a';
    ctx.beginPath(); ctx.arc(Math.cos(armA[1])*r*0.8, Math.sin(armA[1])*r*0.65, r*0.18,0,TAU); ctx.fill();
  } else if(ai===2){ // ===== XLR8: teardrop body, visor, wheel feet, tail =====
    const wag = Math.sin(time*9)*0.35;
    ctx.strokeStyle='#0f2733'; ctx.lineWidth=r*0.3; ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(-fx*r*0.6,-fy*r*0.6);
    ctx.quadraticCurveTo(-fx*r*1.3+px2*wag*r, -fy*r*1.3+py2*wag*r, -fx*r*1.9+px2*wag*r*1.6, -fy*r*1.9+py2*wag*r*1.6);
    ctx.stroke();
    ctx.fillStyle='#101820';
    const w1x=px2*r*0.45-fx*r*0.15, w1y=py2*r*0.45-fy*r*0.15;
    const w2x=-px2*r*0.45-fx*r*0.15, w2y=-py2*r*0.45-fy*r*0.15;
    ctx.beginPath(); ctx.arc(w1x,w1y,r*0.22,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.arc(w2x,w2y,r*0.22,0,TAU); ctx.fill();
    ctx.strokeStyle='#37b6ff'; ctx.lineWidth=1.5;
    for(const [wx,wy] of [[w1x,w1y],[w2x,w2y]]){
      ctx.beginPath(); ctx.arc(wx,wy,r*0.13, time*20, time*20+1.8); ctx.stroke();
    }
    const g = ctx.createRadialGradient(fx*r*0.2,fy*r*0.2,2,0,0,r*1.15);
    g.addColorStop(0,'#1d4e63'); g.addColorStop(1,'#0f2733');
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(fx*r*1.05, fy*r*1.05);
    ctx.quadraticCurveTo(fx*r*1.2+px2*r*0.9, fy*r*1.2+py2*r*0.9, -fx*r*0.75+px2*r*0.55, -fy*r*0.75+py2*r*0.55);
    ctx.quadraticCurveTo(-fx*r*1.0, -fy*r*1.0, -fx*r*0.75-px2*r*0.55, -fy*r*0.75-py2*r*0.55);
    ctx.quadraticCurveTo(fx*r*1.2-px2*r*0.9, fy*r*1.2-py2*r*0.9, fx*r*1.05, fy*r*1.05);
    ctx.fill();
    ctx.fillStyle='#0a1a24';
    ctx.beginPath(); ctx.arc(fx*r*0.18, fy*r*0.18, r*0.78, 0, TAU); ctx.fill();
    ctx.fillStyle='#04070d';
    ctx.beginPath(); ctx.ellipse(fx*r*0.5, fy*r*0.5, r*0.5, r*0.24, faceA, 0, TAU); ctx.fill();
    ctx.fillStyle='#5ce1ff'; ctx.shadowColor='#5ce1ff'; ctx.shadowBlur=8;
    ctx.beginPath(); ctx.ellipse(fx*r*0.58, fy*r*0.58, r*0.3, r*0.09, faceA, 0, TAU); ctx.fill();
    ctx.shadowBlur=0;
  } else if(ai===3){ // ===== DIAMONDHEAD: crystal + facets + back shards =====
    ctx.fillStyle='#2e8f6b';
    for(const [ba,bl] of [[2.5,1.5],[-2.5,1.4],[2.9,1.1]]){
      const aa=faceA+ba;
      ctx.beginPath();
      ctx.moveTo(Math.cos(aa-0.25)*r*0.7, Math.sin(aa-0.25)*r*0.7);
      ctx.lineTo(Math.cos(aa)*r*bl, Math.sin(aa)*r*bl);
      ctx.lineTo(Math.cos(aa+0.25)*r*0.7, Math.sin(aa+0.25)*r*0.7);
      ctx.closePath(); ctx.fill();
    }
    const g = ctx.createRadialGradient(-r*0.3,-r*0.3,2,0,0,r*1.2);
    g.addColorStop(0,'#d9fff0'); g.addColorStop(0.55,'#4be3a4'); g.addColorStop(1,'#1d9e6b');
    ctx.fillStyle=g;
    ctx.beginPath();
    for(let i=0;i<6;i++){ const aa=faceA+i*TAU/6; const rr = i%2? r*0.85 : r*1.15;
      ctx[i?'lineTo':'moveTo'](Math.cos(aa)*rr, Math.sin(aa)*rr); }
    ctx.closePath(); ctx.fill();
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.moveTo(-r*0.5,-r*0.35); ctx.lineTo(r*0.1,-r*0.05); ctx.lineTo(-r*0.3,r*0.45);
    ctx.moveTo(r*0.1,-r*0.05); ctx.lineTo(r*0.55,-r*0.3);
    ctx.stroke();
    ctx.strokeStyle='#e8fff5'; ctx.lineWidth=2;
    ctx.beginPath();
    for(let i=0;i<6;i++){ const aa=faceA+i*TAU/6; const rr = i%2? r*0.85 : r*1.15;
      ctx[i?'lineTo':'moveTo'](Math.cos(aa)*rr, Math.sin(aa)*rr); }
    ctx.closePath(); ctx.stroke();
    for(const s of [-1,1]){
      ctx.fillStyle='#0e5c3f';
      ctx.beginPath(); ctx.arc(fx*r*0.4+px2*s*r*0.3, fy*r*0.4+py2*s*r*0.3, r*0.13,0,TAU); ctx.fill();
      ctx.fillStyle='#a8ffd9';
      ctx.beginPath(); ctx.arc(fx*r*0.4+px2*s*r*0.3, fy*r*0.4+py2*s*r*0.3, r*0.05,0,TAU); ctx.fill();
    }
  } else if(ai===4){ // ===== GHOSTFREAK: ghost skirt, stripes, one tracking eye =====
    ctx.fillStyle='rgba(201,195,245,0.3)';
    for(let i=0;i<3;i++){
      const aa=time*2.2+i*TAU/3;
      ctx.beginPath(); ctx.arc(Math.cos(aa)*r*1.35, Math.sin(aa)*r*1.35, r*0.16,0,TAU); ctx.fill();
    }
    const g = ctx.createRadialGradient(-r*0.25,-r*0.25,2,0,0,r*1.1);
    g.addColorStop(0,'#f1edff'); g.addColorStop(1,'#a89ae8');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    for(let i=0;i<3;i++){
      const ox=(i-1)*r*0.5, oy=r*0.72+Math.sin(time*3+i*2)*r*0.1;
      ctx.beginPath(); ctx.arc(ox,oy,r*0.34,0,TAU); ctx.fill();
    }
    ctx.strokeStyle='rgba(70,60,130,0.5)'; ctx.lineWidth=1.5;
    ctx.beginPath(); ctx.moveTo(-r*0.7,-r*0.15); ctx.lineTo(r*0.7,-r*0.35); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-r*0.7,r*0.25); ctx.lineTo(r*0.7,r*0.05); ctx.stroke();
    ctx.fillStyle='#f1edff';
    ctx.beginPath(); ctx.ellipse(fx*r*0.42, fy*r*0.42, r*0.3, r*0.14, faceA,0,TAU); ctx.fill();
    ctx.fillStyle='#8f7bff'; ctx.shadowColor='#8f7bff'; ctx.shadowBlur=6;
    ctx.beginPath(); ctx.arc(fx*r*0.5, fy*r*0.5, r*0.11,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
  } else if(ai===5){ // ===== GREY MATTER: tiny frog, huge eyes, hop squash =====
    const moving = Math.hypot(p.moveX,p.moveY);
    const hop = moving>0.1 ? Math.abs(Math.sin(time*13))*r*0.2 : 0;
    ctx.fillStyle='#cfe9a8';
    ctx.beginPath(); ctx.ellipse(0,r*0.28-hop,r*0.7,r*0.55,0,0,TAU); ctx.fill();
    const g = ctx.createRadialGradient(-r*0.2,-r*0.2,1,0,0,r*1.1);
    g.addColorStop(0,'#b7e07c'); g.addColorStop(1,'#6f9c3a');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(0,-hop,r*0.85,0,TAU); ctx.fill();
    ctx.fillStyle='rgba(50,80,25,0.5)';
    ctx.beginPath(); ctx.ellipse(-fx*r*0.25,-fy*r*0.25-hop,r*0.5,r*0.28,faceA,0,TAU); ctx.fill();
    for(const s of [-1,1]){
      const exx=fx*r*0.4+px2*s*r*0.48, eyy=fy*r*0.4+py2*s*r*0.48-hop;
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(exx,eyy,r*0.42,0,TAU); ctx.fill();
      ctx.fillStyle='#101522';
      ctx.beginPath(); ctx.arc(exx+fx*r*0.12, eyy+fy*r*0.12, r*0.18,0,TAU); ctx.fill();
    }
  } else if(ai===6){ // ===== ALIEN X: cosmic void body, star speckles, galaxy eyes — secret =====
    const g = ctx.createRadialGradient(0,0,2,0,0,r*1.2);
    g.addColorStop(0,'#2a2a4a'); g.addColorStop(1,'#0a0a14');
    ctx.fillStyle=g; ctx.shadowColor='#8f7bff'; ctx.shadowBlur=18;
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill(); ctx.shadowBlur=0;
    for(let i=0;i<9;i++){
      const sx=Math.sin(i*2.7)*r*0.75, sy=Math.cos(i*1.9)*r*0.7;
      ctx.globalAlpha = 0.35+0.65*Math.abs(Math.sin(time*2.2+i*1.3));
      ctx.fillStyle='#ffffff';
      ctx.beginPath(); ctx.arc(sx,sy,1.6,0,TAU); ctx.fill();
    }
    ctx.globalAlpha=1;
    for(const s of [-1,1]){
      ctx.fillStyle='#ffffff'; ctx.shadowColor='#c9b8ff'; ctx.shadowBlur=8;
      ctx.beginPath(); ctx.ellipse(fx*r*0.35+px2*s*r*0.3, fy*r*0.35+py2*s*r*0.3, r*0.2, r*0.09, faceA,0,TAU); ctx.fill();
    }
    ctx.shadowBlur=0;
    for(const s of [-1,1]){
      ctx.fillStyle='rgba(201,184,255,0.85)';
      ctx.beginPath(); ctx.arc(px2*s*r*1.15, py2*s*r*1.15, r*0.22,0,TAU); ctx.fill();
    }
  } else { // ===== BEN: striped shirt, hair, omnitrix =====
    ctx.fillStyle='#f2f2ec';
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.fill();
    ctx.save();
    ctx.beginPath(); ctx.arc(0,0,r,0,TAU); ctx.clip();
    ctx.fillStyle='#15181f';
    ctx.fillRect(-r,r*0.12,r*2,r*0.22);
    ctx.fillRect(-r,r*0.48,r*2,r*0.22);
    ctx.restore();
    ctx.fillStyle='#4a2f1a';
    ctx.beginPath(); ctx.arc(0,-r*0.55,r*0.52,Math.PI*1.05,Math.PI*1.95); ctx.fill();
    ctx.fillStyle='#101522';
    for(const s of [-1,1]){
      ctx.beginPath(); ctx.arc(fx*r*0.42+px2*s*r*0.3, fy*r*0.42+py2*s*r*0.3, r*0.1,0,TAU); ctx.fill();
    }
  }

  // omnitrix symbol on chest when Ben
  if(!p.transformed){
    ctx.fillStyle='#5ad42a';
    ctx.beginPath(); ctx.arc(0,r*0.35,5,0,TAU); ctx.fill();
    ctx.fillStyle='#0c1a08';
    ctx.beginPath(); ctx.moveTo(-3.4,r*0.35-2); ctx.lineTo(0,r*0.35+2.4); ctx.lineTo(3.4,r*0.35-2); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

function drawEnemy(e){
  const t = ENEMY[e.type];
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.fillStyle='rgba(0,0,0,0.35)';
  ctx.beginPath(); ctx.ellipse(0,e.r*0.9,e.r*0.9,e.r*0.3,0,0,TAU); ctx.fill();
  const flash = e.hitT>0;
  const bodyC = flash ? '#ffffff' : t.color;
  if(e.type==='VILGAX'){                 // ===== BOSS: giant Vilgax =====
    const enrage = e.enraged;
    ctx.translate(0, Math.sin(e.t*2.2)*4);
    // tentacle beard
    ctx.strokeStyle = (enrage && Math.floor(e.t*8)%2===0) ? '#ff8080' : '#22384c';
    ctx.lineWidth = 7; ctx.lineCap = 'round';
    for(let i=0;i<6;i++){
      const bx = -35+i*14, sw = Math.sin(e.t*3+i*1.1)*10;
      ctx.beginPath(); ctx.moveTo(bx, 26);
      ctx.quadraticCurveTo(bx+sw*0.5, 52, bx+sw, 74); ctx.stroke();
    }
    // torso
    const g = ctx.createRadialGradient(-20,-30,10,0,0,85);
    g.addColorStop(0, enrage?'#7d2635':'#31465a'); g.addColorStop(1, enrage?'#3f1020':'#18222e');
    ctx.fillStyle = g; ctx.shadowColor = enrage?'#ff5964':'#31465a'; ctx.shadowBlur = 18;
    ctx.beginPath(); ctx.ellipse(0,0,62,78,0,0,TAU); ctx.fill();
    ctx.shadowBlur = 0;
    // shoulders
    ctx.fillStyle = enrage?'#5c1a28':'#22303f';
    ctx.beginPath(); ctx.ellipse(-52,-38,24,20,0.5,0,TAU); ctx.fill();
    ctx.beginPath(); ctx.ellipse(52,-38,24,20,-0.5,0,TAU); ctx.fill();
    // arms + fists
    ctx.strokeStyle = enrage?'#7d2635':'#2b3d50'; ctx.lineWidth = 16;
    for(const s of [-1,1]){
      const sw2 = Math.sin(e.t*2.5+s)*6;
      ctx.beginPath(); ctx.moveTo(s*52,-34); ctx.quadraticCurveTo(s*78,4,s*60,44+sw2); ctx.stroke();
      ctx.fillStyle = enrage?'#8a3040':'#31465a';
      ctx.beginPath(); ctx.arc(s*60,52+sw2,15,0,TAU); ctx.fill();
    }
    // head + tentacled mouth
    ctx.fillStyle = enrage?'#8a3040':'#2b3d50';
    ctx.beginPath(); ctx.ellipse(0,-72,30,26,0,0,TAU); ctx.fill();
    ctx.strokeStyle = '#d8a77a'; ctx.lineWidth = 3.5;
    for(let i=0;i<5;i++){
      const mx = -16+i*8;
      ctx.beginPath(); ctx.moveTo(mx,-60);
      ctx.quadraticCurveTo(mx+Math.sin(e.t*4+i)*4,-50,mx+Math.sin(e.t*3+i)*6,-44); ctx.stroke();
    }
    // glowing eyes that track you
    const lx = clamp(player.x-e.x,-1,1), ly = clamp(player.y-e.y,-1,1);
    for(const s of [-1,1]){
      ctx.fillStyle = '#ff5964'; ctx.shadowColor = '#ff5964'; ctx.shadowBlur = enrage?16:8;
      ctx.beginPath(); ctx.arc(s*12,-76,6,0,TAU); ctx.fill();
      ctx.shadowBlur = 0;
      ctx.fillStyle = '#2b0b10';
      ctx.beginPath(); ctx.arc(s*12+lx*2.5,-76+ly*2.5,2.4,0,TAU); ctx.fill();
    }
    if(flash){ ctx.globalAlpha = 0.5; ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.ellipse(0,0,62,78,0,0,TAU); ctx.fill(); ctx.globalAlpha = 1; }
    if(e.hp < e.maxHp){
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-80,88,160,7);
      ctx.fillStyle = '#ff5964'; ctx.fillRect(-80,88,160*(e.hp/e.maxHp),7);
    }
  } else if(e.type==='SENTRY'){
    if(e.chargeT>0){
      ctx.save();
      ctx.globalAlpha = 0.25 + 0.25*Math.sin(e.t*30);
      ctx.strokeStyle = '#ff4646'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(e.ax*900, e.ay*900); ctx.stroke();
      ctx.restore();
    }
    ctx.translate(0, Math.sin(e.t*4)*3);
    ctx.shadowColor=t.color; ctx.shadowBlur=12;
    ctx.fillStyle=bodyC;
    ctx.beginPath(); ctx.ellipse(0,0,e.r*1.15,e.r*0.7,0,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle=t.color2; ctx.lineWidth=2;
    const sp = Math.sin(e.t*20)*e.r*0.6;
    ctx.beginPath(); ctx.moveTo(-e.r*1.5,sp); ctx.lineTo(-e.r*0.9,0);
    ctx.moveTo(e.r*1.5,sp); ctx.lineTo(e.r*0.9,0); ctx.stroke();
    ctx.fillStyle = e.chargeT>0 ? '#fff0f0' : '#ff4646';
    ctx.beginPath(); ctx.arc(e.ax*e.r*0.5, e.ay*e.r*0.35, 4.5, 0, TAU); ctx.fill();
  } else if(e.type==='WARBOT'){
    ctx.shadowColor=t.color; ctx.shadowBlur=14;
    ctx.fillStyle=bodyC;
    ctx.beginPath();
    ctx.moveTo(-e.r,-e.r*0.8); ctx.lineTo(e.r,-e.r*0.8);
    ctx.lineTo(e.r*0.8,e.r*0.9); ctx.lineTo(-e.r*0.8,e.r*0.9);
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#1a2030';
    ctx.fillRect(-e.r*0.7,-e.r*0.5,e.r*1.4,e.r*0.5);
    ctx.fillStyle='#ffb020';
    ctx.beginPath(); ctx.arc(0,-e.r*0.25,e.r*0.16,0,TAU); ctx.fill();
    ctx.strokeStyle=bodyC; ctx.lineWidth=4;
    const st = Math.sin(e.t*6)*6;
    ctx.beginPath();
    ctx.moveTo(-e.r*0.5,e.r*0.9); ctx.lineTo(-e.r*0.5+st,e.r*1.3);
    ctx.moveTo(e.r*0.5,e.r*0.9); ctx.lineTo(e.r*0.5-st,e.r*1.3);
    ctx.stroke();
    if(e.hp<e.maxHp){
      ctx.fillStyle='rgba(0,0,0,0.5)'; ctx.fillRect(-e.r,-e.r-12,e.r*2,5);
      ctx.fillStyle='#7dfa4c'; ctx.fillRect(-e.r,-e.r-12,e.r*2*(e.hp/e.maxHp),5);
    }
  } else if(e.type==='DNALIEN'){
    const sq = 1 + Math.sin(e.t*5+e.phase)*0.08 + (e.lungeT>0?0.15:0);
    ctx.shadowColor=t.color; ctx.shadowBlur=12;
    ctx.fillStyle=bodyC;
    ctx.beginPath(); ctx.ellipse(0,0,e.r*sq*1.1,e.r/sq,0,0,TAU); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle=t.color2;
    ctx.beginPath(); ctx.ellipse(0,-e.r*0.7,e.r*0.45,e.r*0.25,0,0,TAU); ctx.fill();
    const dx=player.x-e.x, dy=player.y-e.y, d=Math.hypot(dx,dy)||1;
    ctx.fillStyle='#101522';
    for(const s of [-1,1]){
      ctx.beginPath();
      ctx.arc(dx/d*e.r*0.35 - dy/d*e.r*0.3*s, dy/d*e.r*0.35 + dx/d*e.r*0.3*s, e.r*0.14, 0, TAU);
      ctx.fill();
    }
  } else { // XENOCITE
    ctx.rotate(e.t*6);
    ctx.shadowColor=t.color; ctx.shadowBlur=10;
    ctx.fillStyle=bodyC;
    ctx.beginPath();
    for(let i=0;i<4;i++){ const aa=i*TAU/4; ctx[i?'lineTo':'moveTo'](Math.cos(aa)*e.r, Math.sin(aa)*e.r); }
    ctx.closePath(); ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#d9ff6b';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.35,0,TAU); ctx.fill();
    ctx.fillStyle='#101522';
    ctx.beginPath(); ctx.arc(0,0,e.r*0.15,0,TAU); ctx.fill();
  }
  ctx.restore();
}

function drawHUD(){
  const p = player;
  ctx.textAlign='left';
  // HP
  bar(20, 20, 220, 18, p.hp/p.maxHp, '#ff4d6d', '#ff8fa3', 'HP');
  // Energy
  const eCol = p.rechargeCd>0 ? '#8a8f9a' : (p.transformed && p.energy<25 ? '#ff4d4d' : '#7dfa4c');
  bar(20, 46, 220, 14, p.energy/p.maxEnergy, eCol, '#c8ffb0', 'OMNITRIX');
  if(p.rechargeCd>0){
    ctx.fillStyle='#ffd23f'; ctx.font='bold 11px Segoe UI'; ctx.textAlign='left';
    ctx.fillText('RECHARGING '+p.rechargeCd.toFixed(1)+'s', 20, 76);
    ctx.fillStyle='#1a2440'; ctx.fillRect(20,80,220,4);
    ctx.fillStyle='#ffd23f'; ctx.fillRect(20,80,220*(1-p.rechargeCd/2.5),4);
  }
  // stats
  ctx.fillStyle='#dfe8ff'; ctx.font='bold 16px Segoe UI';
  ctx.fillText('WAVE '+Math.max(1,wave + (betweenWaves?1:0)), 260, 34);
  ctx.fillText('SCORE '+score, 260, 58);
  ctx.fillStyle='#8fa0c0'; ctx.font='12px Segoe UI';
  ctx.fillText('BEST '+best, 260, 76);
  ctx.fillStyle = diffKey==='easy' ? '#7dfa4c' : diffKey==='medium' ? '#ffd23f' : '#ff6b6b';
  ctx.font='bold 11px Segoe UI';
  ctx.fillText(DIFF.label, 260, 93);

  // Vilgax boss bar
  if(boss){
    ctx.textAlign = 'center';
    ctx.fillStyle = '#ff5964'; ctx.font = 'bold 15px Segoe UI';
    ctx.shadowColor = '#ff5964'; ctx.shadowBlur = 12;
    ctx.fillText('VILGAX', W/2, 24);
    ctx.shadowBlur = 0;
    const bw = Math.min(420, W-140);
    bar(W/2-bw/2, 32, bw, 16, boss.hp/boss.maxHp, '#ff5964', '#ffb3b8', '');
  }

  // current alien tag
  const al = p.transformed ? ALIENS[p.alien] : null;
  ctx.textAlign='center';
  ctx.font='bold 15px Segoe UI';
  ctx.fillStyle = al ? al.color : '#7dfa4c';
  ctx.fillText(al ? al.name : 'BEN TENNYSON', W/2, 30);

  // alien slots bottom-center
  const slotY = H-34, slotW = 44, startX = W/2 - (6*slotW)/2;
  for(let i=0;i<6;i++){
    const x = startX + i*slotW + slotW/2;
    const active = i===p.alien;
    ctx.globalAlpha = p.transformed&&active ? 1 : (active?0.95:0.45);
    drawAlienFace(x, slotY-1, i, active?11.5:8.5);
    if(active){ ctx.strokeStyle='#ffffff'; ctx.lineWidth=2; ctx.beginPath(); ctx.arc(x,slotY,15,0,TAU); ctx.stroke(); }
    ctx.globalAlpha = 1;
    ctx.fillStyle='#dfe8ff'; ctx.font='10px Segoe UI';
    ctx.fillText(String(i+1), x, slotY+24);
  }

  // touch buttons
  if(IS_TOUCH){
    // transform button
    const bx = W-62, by = H-62, br = 46;
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(bx,by,br,0,TAU);
    ctx.fillStyle = p.transformed ? '#2b3550' : 'rgba(125,250,76,0.25)'; ctx.fill();
    ctx.strokeStyle = p.transformed ? '#ff9a3d' : '#7dfa4c'; ctx.lineWidth=4; ctx.stroke();
    // energy ring
    ctx.beginPath(); ctx.arc(bx,by,br+5,-Math.PI/2, -Math.PI/2 + TAU*(p.energy/p.maxEnergy));
    ctx.strokeStyle='#7dfa4c'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle = p.transformed ? '#ffb4a2' : '#eaffe0';
    ctx.font='bold 12px Segoe UI'; ctx.textAlign='center';
    ctx.fillText(p.transformed?'REVERT':'GO ALIEN', bx, by+4);
    // cycle button
    const cy = H-150;
    ctx.beginPath(); ctx.arc(bx,cy,32,0,TAU);
    ctx.fillStyle='rgba(90,140,255,0.2)'; ctx.fill();
    ctx.strokeStyle='#5a8cff'; ctx.lineWidth=3; ctx.stroke();
    ctx.fillStyle='#dfe8ff'; ctx.font='bold 16px Segoe UI';
    ctx.fillText('⟳', bx, cy+6);
    // pause button (top-right)
    ctx.globalAlpha = 0.9;
    ctx.beginPath(); ctx.arc(W-36,36,20,0,TAU);
    ctx.fillStyle='rgba(18,26,46,0.85)'; ctx.fill();
    ctx.strokeStyle='#5a8cff'; ctx.lineWidth=2.5; ctx.stroke();
    ctx.fillStyle='#dfe8ff';
    ctx.fillRect(W-42,30,4,12); ctx.fillRect(W-34,30,4,12);
    ctx.globalAlpha = 1;
  } else {
    // omnitrix dial bottom-right
    const bx = W-56, by = H-56, br = 34;
    ctx.save(); ctx.translate(bx,by);
    ctx.rotate(dialAnim*4);
    ctx.beginPath(); ctx.arc(0,0,br,0,TAU);
    const low = dialGlow>0 && Math.floor(time*6)%2===0;
    const cur = low ? '#ff5252' : (p.transformed ? ALIENS[p.alien].color : '#7dfa4c');
    ctx.fillStyle = cur; ctx.shadowColor=cur; ctx.shadowBlur=16+dialGlow*20; ctx.fill();
    ctx.shadowBlur=0;
    ctx.fillStyle='#7dfa4c';
    omnitrixSymbol(br*0.515, br*0.72);
    ctx.restore();
    ctx.fillStyle='#8fa0c0'; ctx.font='11px Segoe UI'; ctx.textAlign='center';
    ctx.fillText('Scroll/Q: dial • Click: transform • E: '+(p.transformed?'revert':'transform'), bx, by+56);
  }
}
function bar(x,y,w,h,frac,c1,c2,label){
  ctx.fillStyle='rgba(10,16,32,0.8)';
  ctx.fillRect(x-2,y-2,w+4,h+4);
  ctx.fillStyle='#1a2440'; ctx.fillRect(x,y,w,h);
  ctx.fillStyle=c1; ctx.fillRect(x,y,w*clamp(frac,0,1),h);
  ctx.fillStyle=c2; ctx.globalAlpha=0.35;
  ctx.fillRect(x,y,w*clamp(frac,0,1),h/3);
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(255,255,255,0.15)'; ctx.lineWidth=1; ctx.strokeRect(x,y,w,h);
  if(label){ ctx.fillStyle='#dfe8ff'; ctx.font='bold 10px Segoe UI'; ctx.fillText(label, x+6, y+h-5); }
}

function drawMenu(){
  ctx.textAlign='center';
  const pulse = 1+Math.sin(time*2)*0.04;
  // big omnitrix
  ctx.save(); ctx.translate(W/2, H*0.24); ctx.scale(pulse,pulse);
  ctx.beginPath(); ctx.arc(0,0,74,0,TAU);
  ctx.fillStyle='#7dfa4c'; ctx.shadowColor='#7dfa4c'; ctx.shadowBlur=40; ctx.fill();
  ctx.shadowBlur=0;
  ctx.fillStyle='#7dfa4c';
  omnitrixSymbol(37, 53);
  ctx.restore();

  ctx.fillStyle='#7dfa4c'; ctx.shadowColor='#7dfa4c'; ctx.shadowBlur=24;
  ctx.font='bold 54px Segoe UI';
  ctx.fillText('OMNITRIX ARENA', W/2, H*0.42);
  ctx.shadowBlur=0;
  ctx.fillStyle='#9fb3d9'; ctx.font='16px Segoe UI';
  ctx.fillText('A Ben 10 fan game — survive Vilgax\'s drone waves', W/2, H*0.42+32);

  // roster
  const n = 6, gap = Math.min(120, (W-80)/n);
  const startX = W/2 - gap*(n-1)/2;
  for(let i=0;i<n;i++){
    const x = startX+i*gap, y = H*0.58;
    drawAlienFace(x, y-4, i, 13);
    ctx.fillStyle='#dfe8ff'; ctx.font='bold 10px Segoe UI';
    ctx.fillText(ALIENS[i].name, x, y+34);
    ctx.fillStyle='#8fa0c0'; ctx.font='9px Segoe UI';
    ctx.fillText(ALIENS[i].desc, x, y+48);
  }

  // difficulty buttons
  menuBtns = [];
  const order = ['easy','medium','hard'];
  const bw = Math.min(150, (W-100)/3 - 12), bh = 42, gap2 = 12;
  const totalW = bw*3 + gap2*2;
  const bx0 = W/2 - totalW/2, by = H*0.67;
  ctx.fillStyle='#8fa0c0'; ctx.font='bold 12px Segoe UI';
  ctx.fillText('DIFFICULTY  (1 / 2 / 3)', W/2, by-10);
  for(let i2=0;i2<3;i2++){
    const key = order[i2];
    const b = { x: bx0+i2*(bw+gap2), y: by, w: bw, h: bh, key };
    menuBtns.push(b);
    const sel = diffKey===key;
    ctx.fillStyle = sel ? 'rgba(125,250,76,0.16)' : 'rgba(18,26,46,0.85)';
    ctx.fillRect(b.x,b.y,b.w,b.h);
    ctx.strokeStyle = sel ? '#7dfa4c' : 'rgba(120,140,180,0.35)';
    ctx.lineWidth = sel ? 3 : 1.5;
    ctx.strokeRect(b.x,b.y,b.w,b.h);
    ctx.fillStyle = sel ? '#eaffe0' : '#9fb3d9';
    ctx.font = 'bold 15px Segoe UI';
    ctx.fillText(DIFFS[key].label, b.x+b.w/2, b.y+18);
    ctx.fillStyle = sel ? '#8fa0c0' : '#56637f';
    ctx.font = '10px Segoe UI';
    ctx.fillText(key==='easy' ? 'chill vibes' : key==='medium' ? 'balanced' : 'drone storm', b.x+b.w/2, b.y+32);
  }
  // sfx volume — vertical slider, tucked on the right edge
  const th = 132, tx = W-46, ty = H*0.28;
  menuSlider = { x: tx-14, y: ty, w: 28, h: th };
  ctx.fillStyle='#8fa0c0'; ctx.font='bold 11px Segoe UI'; ctx.textAlign='center';
  ctx.fillText('SFX', tx, ty-10);
  ctx.fillStyle='#1a2440'; ctx.fillRect(tx-3, ty, 6, th);
  ctx.fillStyle='#7dfa4c'; ctx.fillRect(tx-3, ty+th*(1-volume), 6, th*volume);
  ctx.beginPath(); ctx.arc(tx, ty+th*(1-volume), 8, 0, TAU);
  ctx.fillStyle='#eaffe0'; ctx.fill();
  ctx.strokeStyle='#7dfa4c'; ctx.lineWidth=2; ctx.stroke();
  ctx.fillStyle='#56637f'; ctx.font='10px Segoe UI';
  ctx.fillText(Math.round(volume*100)+'%', tx, ty+th+16);
  if(Math.floor(time*1.6)%2===0){
    ctx.fillStyle='#eaffe0'; ctx.font='bold 22px Segoe UI';
    ctx.fillText(IS_TOUCH?'TAP TO START':'PRESS SPACE TO START', W/2, H*0.80);
  }
  ctx.fillStyle='#6c7a99'; ctx.font='13px Segoe UI';
  const lines = IS_TOUCH
    ? ['Left: move   •   Right: aim + fire   •   Tap alien bar or ⟳: Omnitrix dial (slow-mo)   •   GO ALIEN transform']
    : ['WASD move   •   Mouse aim   •   Space fire   •   Scroll+Click or Q: Omnitrix dial   •   E transform/revert   •   P pause   •   M mute'];
  ctx.fillText(lines[0], W/2, H*0.83);
  ctx.fillText('Energy drains while transformed — revert to Ben to recharge. Fan project; Ben 10 © Cartoon Network.', W/2, H*0.87);
  if(best>0){ ctx.fillStyle='#8fa0c0'; ctx.fillText('BEST SCORE: '+best, W/2, H*0.92); }
}
function drawOver(){
  ctx.fillStyle='rgba(4,6,12,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign='center';
  ctx.fillStyle='#ff4d6d'; ctx.shadowColor='#ff4d6d'; ctx.shadowBlur=24;
  ctx.font='bold 52px Segoe UI';
  ctx.fillText('GAME OVER', W/2, H*0.38);
  ctx.shadowBlur=0;
  ctx.fillStyle='#dfe8ff'; ctx.font='20px Segoe UI';
  ctx.fillText("Vilgax's drones got you.", W/2, H*0.38+40);
  ctx.fillStyle='#7dfa4c'; ctx.font='bold 26px Segoe UI';
  ctx.fillText('SCORE '+score+(score>=best&&score>0?'  ★ NEW BEST':''), W/2, H*0.52);
  ctx.fillStyle='#9fb3d9'; ctx.font='16px Segoe UI';
  ctx.fillText('Waves survived: '+Math.max(0,wave-1)+'    Drones smashed: '+kills, W/2, H*0.52+34);
  if(Math.floor(time*1.6)%2===0){
    ctx.fillStyle='#eaffe0'; ctx.font='bold 20px Segoe UI';
    ctx.fillText(IS_TOUCH?'TAP TO RETRY':'SPACE TO RETRY', W/2, H*0.66);
  }
}

// ---------- Loop ----------
let last = performance.now();
function loop(now){
  if(window.__omni && window.__omni.frozen){ requestAnimationFrame(loop); return; }
  const dt = Math.min(0.05, (now-last)/1000);
  last = now;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// ---------- Debug hook (handy for testing) ----------
window.__omni = {
  get state(){ return state; },
  get player(){ return player; },
  get wave(){ return wave; },
  get score(){ return score; },
  get enemyCount(){ return enemies.length; },
  get boss(){ return boss; },
  get cam(){ return cam; },
  killBoss(){ if(boss) damageEnemy(boss, 1e9, 0, 1); },
  testBoss(){ enemies.length=0; spawnQueue.length=0; boss=null; wave=4; betweenWaves=true; waveTimer=0; for(let i=0;i<40 && !boss;i++) update(1/60); },
  get selectOpen(){ return selectUI.open; },
  get selectIdx(){ return selectUI.idx; },
  get diff(){ return diffKey; },
  get paused(){ return paused; },
  get enemies(){ return enemies; },
  togglePause,
  setDifficulty,
  press(k){ window.dispatchEvent(new KeyboardEvent('keydown',{key:k})); window.dispatchEvent(new KeyboardEvent('keyup',{key:k})); },
  step(n){ for(let i=0;i<n;i++) update(1/60); },
  frozen: false,
  draw,
};
</script>
